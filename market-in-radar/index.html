<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Market-In Radar</title>
<style>
:root{--bg:#090f1e;--panel:#111a33;--panel2:#182344;--text:#eef3ff;--muted:#aab5d1;--line:#27345f;--a:#7c5cff;--b:#18c8ff;--green:#33d69f;--yellow:#ffc857;--red:#ff6379}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#080d1a,#0c1326);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}.wrap{width:min(1220px,calc(100% - 22px));margin:auto;padding:14px 0 44px}.hero,.panel,.stat{background:var(--panel);border:1px solid var(--line);box-shadow:0 12px 32px #0005}.hero{padding:18px;border-radius:22px;background:linear-gradient(135deg,#7c5cff2c,#18c8ff1c)}h1{font-size:clamp(24px,5vw,36px);margin:0 0 6px}.hero p,.desc,.small{color:var(--muted);line-height:1.6}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.fresh{font-size:12px;background:#193326;color:#aef1ce;border:1px solid #2b6e52;padding:6px 10px;border-radius:999px}.chips{display:flex;gap:8px;overflow:auto;padding:14px 1px 4px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#19244a;color:#eaf0ff;padding:8px 12px;border-radius:999px;font-size:13px;cursor:pointer}.chip.active{background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{border-radius:16px;padding:14px}.label{font-size:12px;color:var(--muted)}.value{font-size:27px;font-weight:900;margin:4px 0}.main{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.col{display:grid;gap:14px;align-content:start}.panel{padding:15px;border-radius:18px}.panel h2{font-size:18px;margin:0 0 4px}.list{display:grid;gap:10px}.card{background:var(--panel2);border:1px solid #ffffff0c;border-radius:15px;padding:14px}.cardhead{display:flex;justify-content:space-between;gap:10px}.src{font-size:12px;font-weight:900;color:#73dcff}.title{font-size:16px;font-weight:850;margin:4px 0 8px}.score{min-width:55px;height:36px;display:grid;place-items:center;border-radius:11px;background:#7c5cff24;border:1px solid #7c5cff55;font-weight:900}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:7px 0}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#263564}.body{font-size:13px;color:var(--muted);line-height:1.65}.op{margin-top:9px;padding-top:9px;border-top:1px dashed #ffffff18;color:#dce5ff}.source{display:inline-block;margin-top:9px;color:#77ddff;text-decoration:none;font-size:12px;font-weight:800}.status{font-size:11px;margin-top:7px}.ok{color:#85edba}.warn{color:#ffd67a}.rank{display:grid;grid-template-columns:32px 1fr;gap:9px;background:var(--panel2);border-radius:14px;padding:12px}.n{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));font-weight:900}.rt{font-weight:850;font-size:14px}.rd{font-size:12px;color:var(--muted);line-height:1.55;margin-top:3px}.foot{font-size:11px;color:#7f8baa;margin-top:14px;line-height:1.6}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.main{grid-template-columns:1fr}}@media(max-width:520px){.wrap{width:calc(100% - 14px)}.hero,.panel{padding:13px}.stats{grid-template-columns:repeat(2,1fr)}.value{font-size:22px}.title{font-size:15px}}
</style>
</head>
<body><div class="wrap">
<div class="hero"><div class="topline"><div><h1>Market-In Radar</h1><p>検索・SNS・広告・レビュー・クラファンから「需要の種」を横断観測。</p></div><span class="fresh">最終調査 2026-08-29 JST</span></div></div>
<div class="chips" id="chips"></div><div class="stats" id="stats"></div>
<div class="main"><div class="col"><section class="panel"><h2>最新シグナル</h2><p class="desc">確認できた事実と、そこから考えられる商機を分離して表示。</p><div class="list" id="signals"></div></section></div>
<div class="col"><section class="panel"><h2>今日の発見</h2><div class="list" id="hot"></div></section><section class="panel"><h2>検証候補</h2><div class="list" id="ideas"></div></section></div></div>
<div class="foot">v0.2.0 / 公開情報ベース。スコアは市場規模の確定値ではなく、需要シグナル・課題の強さ・AI適性・小さく検証できる度合いからの探索用評価。取得できない情報は推測で補完せず「未確認」と表示。</div>
</div>
<script>
const data=[
{source:'Google Trends',title:'日本の急上昇検索：草間彌生 200K+、石川県 200K+、フッ化水素酸 100K+、ミスド さつまいもド 20K+',tags:['過去24時間','日本','実検索'],fact:'Google Trendsの日本・過去24時間で確認。上位はニュース・人物・災害・季節商品が中心。',problem:'瞬間的な話題は強いが、そのまま事業需要とは限らない。',opportunity:'急上昇語を「購買」「困りごと」「継続需要」に再分類するAIフィルターが有用。',score:78,url:'https://trends.google.com/trending?geo=JP',status:'取得確認済み',ok:true},
{source:'TikTok',title:'Creative Centerで業界別ハッシュタグ・動画・地域人気を分析可能',tags:['SNS','トレンド','要ログイン'],fact:'TikTok公式はTrends機能で、ハッシュタグの推移・関連動画・オーディエンス・地域人気を確認できると案内。',problem:'公開クローラーでは日本の現在ランキング本文が返らず、今日の具体的順位は未確認。',opportunity:'ログイン取得を前提に、急伸テーマだけを日次でこの画面へ取り込む構成が次の候補。',score:72,url:'https://ads.tiktok.com/creative/creativeCenter/trends?countryCode=JP&period=30',status:'機能確認済み / 現在順位は未確認',ok:false},
{source:'広告',title:'Meta Ad Libraryは現在配信中の広告をキーワード・広告主で検索可能',tags:['広告費','競合','購買意図'],fact:'Meta公式Ad Libraryでは、Metaアプリ上で現在配信中の広告を検索できる。',problem:'広告が多い市場は需要の裏付けになり得る一方、競争過多の可能性もある。',opportunity:'「AI受付」「人手不足」「予約」「議事録」などを定点検索し、出稿社数と訴求軸の変化を見る。',score:83,url:'https://www.facebook.com/ads/library/',status:'検索基盤確認済み / 個別広告集計は次段階',ok:false},
{source:'Amazon',title:'AIボイスレコーダーが従来型ICレコーダーと同じ売れ筋カテゴリに存在',tags:['物販','AI録音','ハード×AI'],fact:'Amazonの検索インデックスではPLAUD NotePin/PLAUD NOTEなどAI文字起こし対応機がボイスレコーダーカテゴリに確認できる。',problem:'取得できたランキング索引は鮮度が古く、2026-08-29現在の順位は未確認。',opportunity:'「録音する」から「要約・タスク化・他アプリ実行」へ価値が移っているかを継続観測する価値あり。',score:74,url:'https://www.amazon.co.jp/gp/bestsellers/electronics/85400051',status:'商品存在確認 / 最新順位は未確認',ok:false},
{source:'App Store',title:'録音アプリの不満：次の録音までの操作、iCloud読み込み、データ消失不安',tags:['レビュー','UX','録音'],fact:'4.4/5・4,970件評価の録音アプリで、録音後の画面遷移やiCloud読み込み速度への不満が確認できる。別レビューではデータ消失への不安もある。',problem:'録音自体より、保存・再開・復元・共有の体験がボトルネック。',opportunity:'ワンタップ録音→確実保存→自動要約→指定先へ転送、までを迷わせないUIに商機。',score:91,url:'https://apps.apple.com/jp/app/id492995106?see-all=reviews',status:'レビュー確認済み',ok:true},
{source:'App Store',title:'法人AIアプリでも「エージェント選択が使いにくい」という声',tags:['法人AI','UI','エージェント'],fact:'JAPAN AIアプリは4.4/5・12件評価。レビューには、エージェント検索やお気に入り機能を求める声がある。',problem:'AI機能が増えるほど「どのAIを使うか選ぶ」こと自体が負担になる。',opportunity:'ユーザーにAIを選ばせず、目的から自動ルーティングするUIが小規模事業者向けに有望。',score:88,url:'https://apps.apple.com/jp/app/japan-ai/id6748817624',status:'レビュー確認済み',ok:true},
{source:'クラウドファンディング',title:'AI-Signal：AI作業の状態を「画面を見ずに光で確認」',tags:['Makuake','2026-08-28開始','AI作業'],fact:'Makuakeで2026-08-28〜11-05のプロジェクトとして公開。AIアシスタント作業中の状態確認を物理シグナル化。',problem:'AIに仕事を任せても、完了したか確認するため画面を何度も見る必要がある。',opportunity:'AIそのものより「AIを監視する負担を減らす」周辺市場が生まれている。',score:90,url:'https://www.makuake.com/project/ai-signal/',status:'現行プロジェクト確認済み',ok:true},
{source:'クラウドファンディング',title:'AIomi：会話→要約→共有→タスク化→1,000以上のアプリ連携',tags:['Makuake','AIレコーダー','自動実行'],fact:'AIomiは録音だけでなく、Slack・Notion等へのワークフロー連携とタスク化を訴求。2026-08-15に活動報告あり。',problem:'会話を録音しても、その後のコピペ・転記・タスク登録が残る。',opportunity:'「記録AI」より「記録後に仕事を実行するAI」へ市場価値が移行している可能性。',score:94,url:'https://www.makuake.com/project/aiomijapan/',status:'プロジェクト・活動報告確認済み',ok:true},
{source:'クラウドファンディング',title:'AIキーボード：17のAI作業を物理キーに集約',tags:['Makuake','音声操作','買い切り'],fact:'文章作成・翻訳・要約・OCR等17機能をキー操作に集約し、複数AIを使い分ける商品が2026-09-13まで掲載。',problem:'プロンプト入力やアプリ切替が、AI初心者には面倒。',opportunity:'高度なAIより「1ボタンで使えるAI」の方が非IT層へ広がりやすいという仮説を検証できる。',score:89,url:'https://www.makuake.com/project/ai_keyboard/',status:'現行プロジェクト確認済み',ok:true}
];
let current='すべて';const cats=['すべて',...new Set(data.map(x=>x.source))];
function render(){document.getElementById('chips').innerHTML=cats.map(x=>`<button class="chip ${x===current?'active':''}" onclick="current='${x}';render()">${x}</button>`).join('');const f=current==='すべて'?data:data.filter(x=>x.source===current),avg=Math.round(f.reduce((s,x)=>s+x.score,0)/(f.length||1));document.getElementById('stats').innerHTML=[['シグナル',f.length,'表示中'],['平均注目度',avg,'探索スコア'],['確認済み',f.filter(x=>x.ok).length,'具体データ'],['未確認含む',f.filter(x=>!x.ok).length,'要追加取得']].map(x=>`<div class="stat"><div class="label">${x[0]}</div><div class="value">${x[1]}</div><div class="small">${x[2]}</div></div>`).join('');document.getElementById('signals').innerHTML=f.sort((a,b)=>b.score-a.score).map(x=>`<article class="card"><div class="cardhead"><div><div class="src">${x.source}</div><div class="title">${x.title}</div></div><div class="score">${x.score}</div></div><div class="tags">${x.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div><div class="body"><b>確認：</b>${x.fact}<br><b>課題：</b>${x.problem}<div class="op"><b>商機仮説：</b>${x.opportunity}</div><div class="status ${x.ok?'ok':'warn'}">● ${x.status}</div><a class="source" href="${x.url}" target="_blank" rel="noopener">一次/参照情報を開く ↗</a></div></article>`).join('')}
render();
const hot=[['記録AI → 実行AI','AIomiは「録音・要約」で終わらず、他アプリ連携とタスク化まで訴求。次の競争軸として重要。'],['AIを使う手間を消す','AIキーボード、AI-Signal、法人AIレビューに共通するのは「AIの操作・選択・確認」自体を減らすこと。'],['レビューはUIの宝庫','録音アプリでは保存や再開、画面遷移など、モデル性能以外の不満が具体的に出ている。']];document.getElementById('hot').innerHTML=hot.map((x,i)=>`<div class="rank"><div class="n">${i+1}</div><div><div class="rt">${x[0]}</div><div class="rd">${x[1]}</div></div></div>`).join('');
const ideas=[['小規模事業者向け「実行するAI秘書」','メールや会話を要約するだけでなく、予約・タスク・返信案・共有まで次の行動につなげる。'],['AIを選ばせない1ボタンUI','利用者は目的だけ押す。裏側で最適なAI/処理を自動選択する。'],['会話→仕事化ツール','録音→文字起こし→要点→担当者→期限→送信先まで自動化。まず1業種で小さく検証。']];document.getElementById('ideas').innerHTML=ideas.map((x,i)=>`<div class="rank"><div class="n">${i+1}</div><div><div class="rt">${x[0]}</div><div class="rd">${x[1]}</div></div></div>`).join('');
</script></body></html>
