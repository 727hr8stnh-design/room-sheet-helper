<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">

<title>客室仕込みヘルパー</title>

<style>

:root{
  --bg:#f4f4f4;
  --card:#ffffff;
  --text:#111111;
  --muted:#666666;
  --border:#dddddd;
  --danger:#b00020;
  --danger-bg:#fff0f2;
  --ok:#126a2f;
  --ok-bg:#eaf6ee;
  --blue:#175cd3;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    "Yu Gothic",
    sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:#111;
  color:#fff;
  padding:
    calc(14px + env(safe-area-inset-top))
    16px
    14px;
  font-size:19px;
  font-weight:900;
}

main{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:14px 14px 120px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 1px 8px #00000012;
}

h1,
h2,
h3{
  margin:0 0 14px;
}

h1{
  font-size:34px;
}

h2{
  font-size:21px;
}

button{
  appearance:none;
  border:0;
  border-radius:13px;
  padding:15px 14px;
  font-size:17px;
  font-weight:900;
  background:#111;
  color:#fff;
  cursor:pointer;
}

button.secondary{
  background:#e7e7e7;
  color:#111;
}

button.ok{
  background:var(--ok);
}

button.danger{
  background:var(--danger);
}

button.blue{
  background:var(--blue);
}

button:disabled{
  opacity:.35;
}

input,
textarea,
select{
  width:100%;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  padding:13px;
  font-size:18px;
  font-family:inherit;
}

textarea{
  min-height:230px;
  resize:vertical;
  line-height:1.45;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.stat{
  background:#f0f0f0;
  border-radius:14px;
  padding:12px 5px;
  text-align:center;
}

.stat strong{
  display:block;
  margin-top:3px;
  font-size:30px;
}

.big{
  font-size:42px;
  font-weight:900;
}

.mid{
  font-size:27px;
  font-weight:900;
}

.muted{
  color:var(--muted);
}

.warn{
  color:var(--danger);
  font-weight:900;
}

.hidden{
  display:none !important;
}

.status{
  border-radius:12px;
  padding:12px;
  margin-top:12px;
  font-weight:800;
}

.status.ok{
  background:var(--ok-bg);
  color:var(--ok);
}

.status.error{
  background:var(--danger-bg);
  color:var(--danger);
}

.roomRow{
  display:grid;
  grid-template-columns:68px 1fr 72px;
  align-items:center;
  gap:7px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.roomRow:last-child{
  border-bottom:0;
}

.roomRow strong{
  font-size:18px;
}

.pill{
  display:inline-block;
  border-radius:999px;
  padding:5px 8px;
  margin:2px 1px;
  background:#eee;
  font-size:12px;
  font-weight:800;
}

.pill.iceYes{
  color:var(--ok);
  background:var(--ok-bg);
}

.pill.iceNo{
  color:var(--danger);
  background:var(--danger-bg);
}

.note{
  border:3px solid #d00000;
  background:#fff1f1;
  border-radius:12px;
  padding:12px;
  font-size:18px;
  font-weight:800;
  white-space:pre-wrap;
}

.dateBox{
  font-size:19px;
  font-weight:900;
}

.importHelp{
  font-size:14px;
  line-height:1.55;
  margin-top:10px;
}

.roomNav{
  position:sticky;
  bottom:74px;
  z-index:5;
}

footer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  background:#fff;
  border-top:1px solid #ddd;
  padding:
    10px
    14px
    calc(10px + env(safe-area-inset-bottom));
}

footer button{
  width:100%;
}

@media(max-width:420px){

  main{
    padding-left:10px;
    padding-right:10px;
  }

  .roomRow{
    grid-template-columns:62px 1fr 66px;
  }

  .roomRow button{
    padding:12px 6px;
    font-size:15px;
  }

}

</style>
</head>

<body>

<header>
  客室仕込みヘルパー
</header>

<main>

<!-- ==================================================
     HOME
================================================== -->

<section id="homeView">

  <div class="card">

    <div class="muted">
      現在のアサイン
    </div>

    <div
      id="currentDate"
      class="dateBox"
    >
      データ未登録
    </div>

  </div>


  <div class="card">

    <h2>
      部屋をすぐ確認
    </h2>

    <div class="grid2">

      <input
        id="quickRoom"
        inputmode="numeric"
        placeholder="例：12"
      >

      <button id="quickBtn">
        表示
      </button>

    </div>

  </div>


  <div class="card">

    <h2>
      本日の集計
    </h2>

    <div class="grid3">

      <div class="stat">
        使用室
        <strong id="roomCount">
          0
        </strong>
      </div>

      <div class="stat">
        宿泊者
        <strong id="guestCount">
          0
        </strong>
      </div>

      <div class="stat">
        氷補充
        <strong id="iceCount">
          0
        </strong>
      </div>

    </div>

  </div>


  <div class="card">

    <button
      id="openImportBtn"
      class="blue"
      style="width:100%"
    >
      本日のアサインを更新
    </button>

  </div>


  <div class="card">

    <h2>
      部屋一覧
    </h2>

    <div id="roomList">

      <div class="muted">
        本日のデータを登録してください。
      </div>

    </div>

  </div>

</section>



<!-- ==================================================
     IMPORT
================================================== -->

<section
  id="importView"
  class="hidden"
>

  <div class="card">

    <button
      id="importBackBtn"
      class="secondary"
    >
      ← 戻る
    </button>

    <div style="height:16px"></div>

    <h2>
      本日のアサインを更新
    </h2>

    <div class="importHelp muted">

      ChatGPTで今日の用紙を読み取ったあと、
      出力されたJSONを下に貼り付けてください。

    </div>

    <div style="height:12px"></div>

    <textarea
      id="importText"
      placeholder='{
  "date":"2026-08-27",
  "rooms":[
    {
      "room":1,
      "adult":2,
      "child":1,
      "meal":"dinner",
      "note":""
    }
  ]
}'
    ></textarea>


    <div style="height:12px"></div>


    <button
      id="importBtn"
      class="blue"
      style="width:100%"
    >
      このデータを反映
    </button>


    <div
      id="importStatus"
      class="hidden"
    ></div>

  </div>


  <div class="card">

    <h2>
      食事区分
    </h2>

    <div class="muted importHelp">

      dinner ＝ 夕食あり<br>
      premium ＝ プレミアム<br>
      breakfast ＝ 朝食のみ<br>
      none ＝ 素泊まり<br>
      unknown ＝ 不明

    </div>

  </div>

</section>



<!-- ==================================================
     ROOM DETAIL
================================================== -->

<section
  id="roomView"
  class="hidden"
>

  <div class="card">

    <button
      id="roomBackBtn"
      class="secondary"
    >
      ← 一覧
    </button>


    <div style="height:18px"></div>


    <h1>
      <span id="vRoom"></span>号室
    </h1>


    <div class="grid3">

      <div class="stat">
        大人
        <strong id="vAdult">
          0
        </strong>
      </div>

      <div class="stat">
        子供
        <strong id="vChild">
          0
        </strong>
      </div>

      <div class="stat">
        合計
        <strong id="vTotal">
          0
        </strong>
      </div>

    </div>

  </div>



  <div class="card">

    <div class="muted">
      シーツ
    </div>

    <div class="big">
      <span id="vSheets">
        0
      </span>
      セット
    </div>

  </div>



  <div class="card">

    <div class="muted">
      バッシングBOX
    </div>

    <div
      id="vBox"
      class="mid"
    >
      不要
    </div>

    <div
      id="vMeal"
      class="muted"
      style="margin-top:8px"
    ></div>

  </div>



  <div class="card">

    <h2>
      氷確認
    </h2>

    <div class="grid2">

      <button
        id="iceYesBtn"
        class="ok"
      >
        氷あり
      </button>

      <button
        id="iceNoBtn"
        class="danger"
      >
        氷なし
      </button>

    </div>


    <div style="height:10px"></div>


    <button
      id="iceResetBtn"
      class="secondary"
      style="width:100%"
    >
      氷確認をリセット
    </button>


    <div
      id="iceState"
      class="muted"
      style="margin-top:12px"
    >
      未確認
    </div>

  </div>



  <div class="card">

    <h2>
      特記事項
    </h2>

    <div
      id="vNote"
      class="note"
    >
      特記事項なし
    </div>

  </div>



  <div class="card roomNav">

    <div class="grid2">

      <button
        id="prevRoomBtn"
        class="secondary"
      >
        ← 前の部屋
      </button>

      <button
        id="nextRoomBtn"
        class="secondary"
      >
        次の部屋 →
      </button>

    </div>

  </div>

</section>

</main>



<footer>

  <button
    id="iceListBtn"
    class="secondary"
  >
    氷補充リスト
  </button>

</footer>



<script>

/* ==================================================
   STORAGE
================================================== */

const DATA_KEY =
  "room_helper_daily_data";

const ICE_PREFIX =
  "room_helper_ice_";


let appData =
  loadData();

let currentRoom =
  null;



/* ==================================================
   BASIC
================================================== */

function $(id){

  return document.getElementById(id);

}


function loadData(){

  try{

    return JSON.parse(
      localStorage.getItem(DATA_KEY)
    ) || {
      date:"",
      rooms:[]
    };

  }catch(e){

    return {
      date:"",
      rooms:[]
    };

  }

}


function saveData(){

  localStorage.setItem(
    DATA_KEY,
    JSON.stringify(appData)
  );

}


function getIceKey(){

  return ICE_PREFIX +
    (
      appData.date ||
      "unknown"
    );

}


function loadIce(){

  try{

    return JSON.parse(
      localStorage.getItem(
        getIceKey()
      )
    ) || {};

  }catch(e){

    return {};

  }

}


function saveIce(data){

  localStorage.setItem(
    getIceKey(),
    JSON.stringify(data)
  );

}



/* ==================================================
   ROOM HELPERS
================================================== */

function total(r){

  return (
    Number(r.adult) || 0
  ) + (
    Number(r.child) || 0
  );

}


function sheets(r){

  return Math.min(
    Math.max(
      total(r),
      0
    ),
    4
  );

}


function mealName(meal){

  switch(meal){

    case "dinner":
      return "夕食あり";

    case "premium":
      return "プレミアム";

    case "breakfast":
      return "朝食のみ";

    case "none":
      return "素泊まり";

    case "unknown":
      return "不明";

    default:
      return "不明";

  }

}


function needsBox(r){

  return (
    r.meal === "dinner" ||
    r.meal === "premium"
  );

}


function sortedRooms(){

  return [...appData.rooms]
    .sort(
      (a,b) =>
        Number(a.room) -
        Number(b.room)
    );

}



/* ==================================================
   VIEW
================================================== */

function showOnly(viewId){

  [
    "homeView",
    "importView",
    "roomView"
  ].forEach(id=>{

    $(id).classList.toggle(
      "hidden",
      id !== viewId
    );

  });

}


function showHome(){

  showOnly(
    "homeView"
  );

  currentRoom =
    null;

  renderAll();

  window.scrollTo(
    0,
    0
  );

}



/* ==================================================
   HOME RENDER
================================================== */

function renderAll(){

  renderDate();

  renderStats();

  renderRooms();

}


function renderDate(){

  $("currentDate").textContent =
    appData.date
      ? appData.date
      : "データ未登録";

}


function renderStats(){

  const ice =
    loadIce();


  $("roomCount").textContent =
    appData.rooms.length;


  $("guestCount").textContent =
    appData.rooms.reduce(
      (sum,r) =>
        sum + total(r),
      0
    );


  $("iceCount").textContent =
    appData.rooms.filter(
      r =>
        ice[r.room] === "no"
    ).length;

}


function renderRooms(){

  const container =
    $("roomList");


  if(
    !appData.rooms.length
  ){

    container.innerHTML =
      '<div class="muted">本日のデータを登録してください。</div>';

    return;

  }


  const ice =
    loadIce();


  container.innerHTML =
    sortedRooms()
    .map(r=>{


      let iceMark = "";


      if(
        ice[r.room] === "yes"
      ){

        iceMark =
          '<span class="pill iceYes">氷あり</span>';

      }


      if(
        ice[r.room] === "no"
      ){

        iceMark =
          '<span class="pill iceNo">氷補充</span>';

      }


      return `

      <div class="roomRow">

        <strong>
          ${r.room}号室
        </strong>


        <div>

          <span class="pill">
            ${total(r)}名
          </span>

          <span class="pill">
            大${Number(r.adult)||0}
          </span>

          <span class="pill">
            子${Number(r.child)||0}
          </span>

          <span class="pill">
            シーツ${sheets(r)}
          </span>

          <span class="pill">
            BOX:${needsBox(r) ? "1" : "0"}
          </span>

          ${iceMark}

        </div>


        <button
          class="secondary"
          onclick="showRoom(${Number(r.room)})"
        >
          表示
        </button>

      </div>

      `;

    })
    .join("");

}



/* ==================================================
   ROOM VIEW
================================================== */

function showRoom(roomNumber){

  const room =
    appData.rooms.find(
      r =>
        Number(r.room) ===
        Number(roomNumber)
    );


  if(!room){

    alert(
      roomNumber +
      "号室は本日の使用部屋ではありません"
    );

    return;

  }


  currentRoom =
    room;


  $("vRoom").textContent =
    room.room;


  $("vAdult").textContent =
    Number(room.adult) || 0;


  $("vChild").textContent =
    Number(room.child) || 0;


  $("vTotal").textContent =
    total(room);


  $("vSheets").textContent =
    sheets(room);


  $("vMeal").textContent =
    "食事：" +
    mealName(room.meal);


  if(
    needsBox(room)
  ){

    $("vBox").textContent =
      "1個 必要";

    $("vBox").className =
      "mid warn";

  }else{

    $("vBox").textContent =
      "不要";

    $("vBox").className =
      "mid";

  }


  $("vNote").textContent =
    String(
      room.note || ""
    ).trim() ||
    "特記事項なし";


  renderIceState();

  renderRoomNav();


  showOnly(
    "roomView"
  );


  window.scrollTo(
    0,
    0
  );

}



/* ==================================================
   ROOM NAV
================================================== */

function renderRoomNav(){

  if(!currentRoom){
    return;
  }


  const rooms =
    sortedRooms();


  const index =
    rooms.findIndex(
      r =>
        Number(r.room) ===
        Number(currentRoom.room)
    );


  const prev =
    index > 0
      ? rooms[index - 1]
      : null;


  const next =
    index >= 0 &&
    index < rooms.length - 1
      ? rooms[index + 1]
      : null;



  if(prev){

    $("prevRoomBtn").disabled =
      false;

    $("prevRoomBtn").textContent =
      "← " +
      prev.room +
      "号室";

    $("prevRoomBtn").onclick =
      ()=>showRoom(
        prev.room
      );

  }else{

    $("prevRoomBtn").disabled =
      true;

    $("prevRoomBtn").textContent =
      "← 前の部屋";

    $("prevRoomBtn").onclick =
      null;

  }



  if(next){

    $("nextRoomBtn").disabled =
      false;

    $("nextRoomBtn").textContent =
      next.room +
      "号室 →";

    $("nextRoomBtn").onclick =
      ()=>showRoom(
        next.room
      );

  }else{

    $("nextRoomBtn").disabled =
      true;

    $("nextRoomBtn").textContent =
      "次の部屋 →";

    $("nextRoomBtn").onclick =
      null;

  }

}



/* ==================================================
   ICE
================================================== */

function renderIceState(){

  if(!currentRoom){
    return;
  }


  const ice =
    loadIce();


  const state =
    ice[currentRoom.room];


  if(
    state === "yes"
  ){

    $("iceState").textContent =
      "確認済み：氷あり";

    $("iceState").style.color =
      "#126a2f";

    $("iceState").style.fontWeight =
      "900";

  }

  else if(
    state === "no"
  ){

    $("iceState").textContent =
      "要補充：氷なし";

    $("iceState").style.color =
      "#b00020";

    $("iceState").style.fontWeight =
      "900";

  }

  else{

    $("iceState").textContent =
      "未確認";

    $("iceState").style.color =
      "";

    $("iceState").style.fontWeight =
      "";

  }

}


$("iceYesBtn").onclick =
function(){

  if(!currentRoom){
    return;
  }


  const ice =
    loadIce();


  ice[currentRoom.room] =
    "yes";


  saveIce(
    ice
  );


  renderIceState();

  renderStats();

  renderRooms();

};


$("iceNoBtn").onclick =
function(){

  if(!currentRoom){
    return;
  }


  const ice =
    loadIce();


  ice[currentRoom.room] =
    "no";


  saveIce(
    ice
  );


  renderIceState();

  renderStats();

  renderRooms();

};


$("iceResetBtn").onclick =
function(){

  if(!currentRoom){
    return;
  }


  const ice =
    loadIce();


  delete ice[
    currentRoom.room
  ];


  saveIce(
    ice
  );


  renderIceState();

  renderStats();

  renderRooms();

};



/* ==================================================
   ICE LIST
================================================== */

$("iceListBtn").onclick =
function(){

  const ice =
    loadIce();


  const list =
    sortedRooms()
      .filter(
        r =>
          ice[r.room] === "no"
      );


  if(
    !list.length
  ){

    alert(
      "氷補充が必要な部屋はありません"
    );

    return;

  }


  alert(

    "氷補充：" +
    list.length +
    "室\n\n" +

    list
      .map(
        r =>
          r.room +
          "号室"
      )
      .join("\n")

  );

};



/* ==================================================
   QUICK ROOM
================================================== */

$("quickBtn").onclick =
function(){

  const value =
    $("quickRoom")
      .value
      .trim();


  if(!value){
    return;
  }


  showRoom(
    Number(value)
  );

};


$("quickRoom")
.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "Enter"
    ){

      $("quickBtn")
        .click();

    }

  }
);



/* ==================================================
   IMPORT VIEW
================================================== */

$("openImportBtn").onclick =
function(){

  $("importText").value =
    "";

  $("importStatus").className =
    "hidden";

  $("importStatus").textContent =
    "";

  showOnly(
    "importView"
  );


  window.scrollTo(
    0,
    0
  );

};


$("importBackBtn").onclick =
function(){

  showHome();

};



/* ==================================================
   JSON CLEANUP
================================================== */

function cleanJsonText(text){

  let value =
    String(text || "")
      .trim();


  /*
  ChatGPTのコードブロックを
  そのままコピーした場合に対応
  */

  value =
    value.replace(
      /^```(?:json)?\s*/i,
      ""
    );


  value =
    value.replace(
      /\s*```$/,
      ""
    );


  return value.trim();

}



/* ==================================================
   VALIDATION
================================================== */

function normalizeData(data){

  if(
    !data ||
    typeof data !== "object"
  ){

    throw new Error(
      "データ形式が正しくありません"
    );

  }


  if(
    !Array.isArray(
      data.rooms
    )
  ){

    throw new Error(
      "rooms がありません"
    );

  }


  const normalizedRooms =
    data.rooms.map(
      (r,index)=>{


        const room =
          Number(r.room);


        if(
          !Number.isInteger(room)
        ){

          throw new Error(
            (index + 1) +
            "件目の部屋番号が不正です"
          );

        }


        const adult =
          Math.max(
            0,
            Number(r.adult) || 0
          );


        const child =
          Math.max(
            0,
            Number(r.child) || 0
          );


        let meal =
          String(
            r.meal || "unknown"
          );


        const allowed =
          [
            "dinner",
            "premium",
            "breakfast",
            "none",
            "unknown"
          ];


        if(
          !allowed.includes(meal)
        ){

          meal =
            "unknown";

        }


        return {

          room,

          adult,

          child,

          meal,

          note:
            String(
              r.note || ""
            )

        };

      }
    );


  /*
  同じ部屋番号を除外
  */

  const map =
    new Map();


  normalizedRooms.forEach(
    r=>{
      map.set(
        r.room,
        r
      );
    }
  );


  const rooms =
    [...map.values()]
      .sort(
        (a,b) =>
          a.room -
          b.room
      );


  return {

    date:
      String(
        data.date || ""
      ).trim(),

    rooms

  };

}



/* ==================================================
   IMPORT
================================================== */

$("importBtn").onclick =
function(){

  const status =
    $("importStatus");


  try{


    const raw =
      cleanJsonText(
        $("importText").value
      );


    if(!raw){

      throw new Error(
        "データを貼り付けてください"
      );

    }


    const parsed =
      JSON.parse(
        raw
      );


    const normalized =
      normalizeData(
        parsed
      );


    if(
      !normalized.rooms.length
    ){

      throw new Error(
        "部屋データが0件です"
      );

    }


    const oldDate =
      appData.date;


    const newDate =
      normalized.date;


    /*
    日付が変わった場合は
    氷状態も別保存になるので
    前日の状態は混ざらない
    */


    appData =
      normalized;


    saveData();


    status.className =
      "status ok";


    status.textContent =
      appData.rooms.length +
      "室を登録しました";


    setTimeout(
      ()=>{

        showHome();

      },
      500
    );


  }catch(e){


    status.className =
      "status error";


    status.textContent =
      "反映できません：" +
      e.message;

  }

};
