<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>客室仕込みヘルパー</title>

<style>
:root{
  --bg:#f4f4f4;
  --card:#fff;
  --text:#111;
  --muted:#666;
  --danger:#b00020;
  --ok:#126a2f;
  --border:#ddd;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  position:sticky;
  top:0;
  z-index:20;
  background:#111;
  color:#fff;
  padding:15px 16px;
  font-size:19px;
  font-weight:900;
}
main{
  max-width:760px;
  margin:auto;
  padding:14px 14px 110px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:13px;
  box-shadow:0 1px 8px #0001;
}
h1,h2{margin:0 0 12px}
h1{font-size:30px}
h2{font-size:22px}
button,.btn{
  appearance:none;
  border:0;
  border-radius:12px;
  padding:14px 15px;
  font-size:17px;
  font-weight:900;
  background:#111;
  color:#fff;
}
.secondary{background:#e7e7e7!important;color:#111!important}
.ok{background:#126a2f!important}
.danger{background:#b00020!important}
input,select,textarea{
  width:100%;
  padding:13px;
  font-size:18px;
  border:1px solid var(--border);
  border-radius:11px;
  background:#fff;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hidden{display:none!important}
.muted{color:var(--muted)}
.warn{color:#b00020;font-weight:900}
.stat{
  background:#f0f0f0;
  padding:12px 5px;
  text-align:center;
  border-radius:13px;
}
.stat strong{display:block;font-size:30px}
.big{font-size:40px;font-weight:900}
.mid{font-size:27px;font-weight:900}
.note{
  border:3px solid #d00000;
  background:#fff1f1;
  border-radius:13px;
  padding:13px;
  font-size:19px;
  font-weight:900;
  white-space:pre-wrap;
}
.roomRow{
  display:grid;
  grid-template-columns:76px 1fr auto;
  gap:8px;
  align-items:center;
  padding:11px 0;
  border-bottom:1px solid #eee;
}
.pill{
  display:inline-block;
  padding:5px 8px;
  margin:2px;
  border-radius:999px;
  background:#eee;
  font-size:13px;
  font-weight:800;
}
.review{
  display:inline-block;
  color:#b00020;
  font-size:13px;
  font-weight:900;
}
.photoButton{
  display:block;
  text-align:center;
  cursor:pointer;
}
#originalPreview,#correctedPreview{
  width:100%;
  max-height:340px;
  object-fit:contain;
  margin-top:12px;
  background:#ddd;
  border-radius:11px;
}
.progress{
  height:10px;
  margin-top:12px;
  background:#ddd;
  border-radius:999px;
  overflow:hidden;
}
.progress div{
  width:0;
  height:100%;
  background:#111;
}
footer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid #ddd;
  background:#fff;
}
footer button{
  display:block;
  width:100%;
  max-width:720px;
  margin:auto;
}
</style>

<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>

const $ = id => document.getElementById(id);

let rooms = JSON.parse(localStorage.getItem("roomHelperRoomsV3") || "[]");
let selectedFile = null;
let current = null;

/*
==================================================
今回のルームアサイン表専用レイアウト
==================================================

自動補正後の「用紙全体」を 0〜1 とした位置。

男      0.417〜0.461
女      0.461〜0.505
子A     0.505〜0.548
子B     0.548〜0.590
子C     0.590〜0.633
子D     0.633〜0.676

大人 = 男 + 女
子供 = 子A + 子B + 子C + 子D
*/

const FORM = {
  firstRowTop: 0.091,
  lastRowBottom: 0.897,

  mealX1: 0.339,
  mealX2: 0.416,

  countX: [
    [0.417,0.461], // 男
    [0.461,0.505], // 女
    [0.505,0.548], // 子A
    [0.548,0.590], // 子B
    [0.590,0.633], // 子C
    [0.633,0.676]  // 子D
  ],

  noteX1: 0.676,
  noteX2: 0.930
};


/*
==================================================
基本
==================================================
*/

function save(){
  localStorage.setItem("roomHelperRoomsV3",JSON.stringify(rooms));
  renderList();
  updateStats();
}

function sheetsFor(total){
  if(total <= 0) return 0;
  return Math.min(total,4);
}

function boxNeeded(meal){
  return meal === "regular" || meal === "premium";
}

function mealLabel(meal){
  switch(meal){
    case "regular": return "レギュラー";
    case "premium": return "プレミアム";
    case "breakfast": return "朝食のみ";
    case "none": return "素泊まり";
    default: return "食事不明";
  }
}

function escapeHtml(text){
  return String(text || "").replace(/[&<>"]/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;"
  }[m]));
}


/*
==================================================
写真
==================================================
*/

function selectPhoto(file){

  if(!file) return;

  selectedFile = file;

  $("selectedName").textContent =
    "選択中：" + file.name;

  $("originalPreview").src =
    URL.createObjectURL(file);

  $("originalPreview").classList.remove("hidden");
}

$("cameraPhoto").onchange =
  e => selectPhoto(e.target.files[0]);

$("libraryPhoto").onchange =
  e => selectPhoto(e.target.files[0]);

function loadImage(file){

  return new Promise((resolve,reject)=>{

    const img = new Image();

    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = URL.createObjectURL(file);

  });
}


/*
==================================================
OpenCV待機
==================================================
*/

async function waitForCV(){

  for(let i=0;i<100;i++){

    if(
      window.cv &&
      cv.Mat &&
      typeof cv.imread === "function"
    ){
      return true;
    }

    await new Promise(r=>setTimeout(r,200));
  }

  return false;
}


/*
==================================================
四隅並び替え
==================================================
*/

function orderPoints(points){

  const sorted = [...points];

  const sums = sorted.map(p=>p.x+p.y);
  const diffs = sorted.map(p=>p.x-p.y);

  const tl = sorted[sums.indexOf(Math.min(...sums))];
  const br = sorted[sums.indexOf(Math.max(...sums))];

  const tr = sorted[diffs.indexOf(Math.max(...diffs))];
  const bl = sorted[diffs.indexOf(Math.min(...diffs))];

  return [tl,tr,br,bl];
}

function dist(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}


/*
==================================================
用紙自動検出・台形補正
==================================================
*/

function autoCorrectDocument(img){

  const temp =
    document.createElement("canvas");

  temp.width = img.naturalWidth || img.width;
  temp.height = img.naturalHeight || img.height;

  const tctx = temp.getContext("2d");
  tctx.drawImage(img,0,0,temp.width,temp.height);

  let src = cv.imread(temp);

  /*
  iPhone写真が巨大な場合は縮小して
  輪郭検出を安定・高速化
  */

  let detection = new cv.Mat();

  const maxDetect = 1200;

  let scale = Math.min(
    1,
    maxDetect / Math.max(src.cols,src.rows)
  );

  cv.resize(
    src,
    detection,
    new cv.Size(
      Math.round(src.cols*scale),
      Math.round(src.rows*scale)
    ),
    0,0,
    cv.INTER_AREA
  );

  let gray = new cv.Mat();
  let blur = new cv.Mat();
  let edges = new cv.Mat();

  cv.cvtColor(
    detection,
    gray,
    cv.COLOR_RGBA2GRAY
  );

  cv.GaussianBlur(
    gray,
    blur,
    new cv.Size(5,5),
    0
  );

  cv.Canny(
    blur,
    edges,
    50,
    150
  );

  let contours =
    new cv.MatVector();

  let hierarchy =
    new cv.Mat();

  cv.findContours(
    edges,
    contours,
    hierarchy,
    cv.RETR_LIST,
    cv.CHAIN_APPROX_SIMPLE
  );

  let best = null;
  let bestArea = 0;

  for(let i=0;i<contours.size();i++){

    const cnt =
      contours.get(i);

    const area =
      cv.contourArea(cnt);

    if(area < bestArea){
      cnt.delete();
      continue;
    }

    const peri =
      cv.arcLength(cnt,true);

    let approx =
      new cv.Mat();

    cv.approxPolyDP(
      cnt,
      approx,
      0.02*peri,
      true
    );

    if(
      approx.rows === 4 &&
      area > bestArea
    ){

      bestArea = area;

      if(best)
        best.delete();

      best = approx;

    }else{

      approx.delete();

    }

    cnt.delete();
  }

  /*
  用紙輪郭が取れない場合
  元画像をそのまま利用
  */

  if(!best){

    const fallback =
      document.createElement("canvas");

    fallback.width = src.cols;
    fallback.height = src.rows;

    cv.imshow(fallback,src);

    src.delete();
    detection.delete();
    gray.delete();
    blur.delete();
    edges.delete();
    contours.delete();
    hierarchy.delete();

    return fallback;
  }

  const pts = [];

  for(let i=0;i<4;i++){

    pts.push({
      x:
        best.data32S[i*2] / scale,
      y:
        best.data32S[i*2+1] / scale
    });
  }

  const [tl,tr,br,bl] =
    orderPoints(pts);

  let width =
    Math.max(
      dist(tl,tr),
      dist(bl,br)
    );

  let height =
    Math.max(
      dist(tl,bl),
      dist(tr,br)
    );

  /*
  用紙は縦長前提
  */

  if(width > height){
    const tmp = width;
    width = height;
    height = tmp;
  }

  width =
    Math.round(width);

  height =
    Math.round(height);

  /*
  OCR用に最大高さ1800px程度へ
  */

  const resizeScale =
    Math.min(
      1,
      1800/height
    );

  const outW =
    Math.round(width*resizeScale);

  const outH =
    Math.round(height*resizeScale);

  const srcPoints =
    cv.matFromArray(
      4,
      1,
      cv.CV_32FC2,
      [
        tl.x,tl.y,
        tr.x,tr.y,
        br.x,br.y,
        bl.x,bl.y
      ]
    );

  const dstPoints =
    cv.matFromArray(
      4,
      1,
      cv.CV_32FC2,
      [
        0,0,
        outW-1,0,
        outW-1,outH-1,
        0,outH-1
      ]
    );

  const matrix =
    cv.getPerspectiveTransform(
      srcPoints,
      dstPoints
    );

  let warped =
    new cv.Mat();

  cv.warpPerspective(
    src,
    warped,
    matrix,
    new cv.Size(outW,outH),
    cv.INTER_LINEAR,
    cv.BORDER_CONSTANT,
    new cv.Scalar()
  );

  const output =
    document.createElement("canvas");

  output.width = outW;
  output.height = outH;

  cv.imshow(
    output,
    warped
  );

  src.delete();
  detection.delete();
  gray.delete();
  blur.delete();
  edges.delete();
  contours.delete();
  hierarchy.delete();
  best.delete();
  srcPoints.delete();
  dstPoints.delete();
  matrix.delete();
  warped.delete();

  return output;
}


/*
==================================================
セル切り出し
==================================================
*/

function rowBounds(room){

  const totalHeight =
    FORM.lastRowBottom -
    FORM.firstRowTop;

  const rowH =
    totalHeight / 32;

  const y1 =
    FORM.firstRowTop +
    (room-1)*rowH;

  const y2 =
    y1 + rowH;

  return [y1,y2];
}

function cropNormalized(
  source,
  x1,y1,x2,y2,
  scale=4
){

  const sx =
    Math.floor(source.width*x1);

  const sy =
    Math.floor(source.height*y1);

  const sw =
    Math.max(
      1,
      Math.floor(
        source.width*(x2-x1)
      )
    );

  const sh =
    Math.max(
      1,
      Math.floor(
        source.height*(y2-y1)
      )
    );

  const canvas =
    document.createElement("canvas");

  canvas.width =
    sw*scale;

  canvas.height =
    sh*scale;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    source,
    sx,sy,sw,sh,
    0,0,
    canvas.width,
    canvas.height
  );

  /*
  グレースケール＋二値化寄りの
  コントラスト強調
  */

  const data =
    ctx.getImageData(
      0,0,
      canvas.width,
      canvas.height
    );

  const p = data.data;

  for(let i=0;i<p.length;i+=4){

    const gray =
      0.299*p[i] +
      0.587*p[i+1] +
      0.114*p[i+2];

    const value =
      gray > 175
      ? 255
      : gray < 95
      ? 0
      : gray;

    p[i] =
      p[i+1] =
      p[i+2] =
      value;
  }

  ctx.putImageData(data,0,0);

  return canvas;
}


/*
==================================================
数字セルOCR
==================================================
*/

async function readDigitCell(
  worker,
  source,
  room,
  columnIndex
){

  const [y1,y2] =
    rowBounds(room);

  const [x1,x2] =
    FORM.countX[columnIndex];

  /*
  罫線を避ける
  */

  const mx =
    (x2-x1)*0.12;

  const my =
    (y2-y1)*0.13;

  const canvas =
    cropNormalized(
      source,
      x1+mx,
      y1+my,
      x2-mx,
      y2-my,
      5
    );

  const result =
    await worker.recognize(canvas);

  const digits =
    result.data.text
    .replace(/[^0-9]/g,"");

  if(!digits)
    return null;

  return Number(digits[0]);
}


/*
==================================================
人数6列

まず男〜子Dをまとめて読む。
失敗したら各セルを個別OCR。
==================================================
*/

async function readCounts(
  worker,
  source,
  room
){

  const [y1,y2] =
    rowBounds(room);

  const x1 =
    FORM.countX[0][0];

  const x2 =
    FORM.countX[5][1];

  const my =
    (y2-y1)*0.12;

  const canvas =
    cropNormalized(
      source,
      x1,
      y1+my,
      x2,
      y2-my,
      4
    );

  const result =
    await worker.recognize(canvas);

  const text =
    result.data.text
    .replace(/[^0-9]/g,"");

  let counts = null;

  if(text.length === 6){

    counts =
      text.split("")
      .map(Number);

  }else{

    /*
    フォールバック：
    男・女・子A〜Dを
    1セルずつOCR
    */

    counts = [];

    for(let i=0;i<6;i++){

      const n =
        await readDigitCell(
          worker,
          source,
          room,
          i
        );

      counts.push(n);

    }
  }

  const review =
    counts.some(
      v => v === null ||
      Number.isNaN(v)
    );

  const safe =
    counts.map(
      v =>
      Number.isFinite(v)
      ? v
      : 0
    );

  const [
    male,
    female,
    childA,
    childB,
    childC,
    childD
  ] = safe;

  return {
    male,
    female,
    childA,
    childB,
    childC,
    childD,

    adult:
      male+female,

    child:
      childA+
      childB+
      childC+
      childD,

    review
  };
}


/*
==================================================
食事OCR
==================================================
*/

async function readMeal(
  worker,
  source,
  room
){

  const [y1,y2] =
    rowBounds(room);

  const canvas =
    cropNormalized(
      source,
      FORM.mealX1,
      y1,
      FORM.mealX2,
      y2,
      4
    );

  const result =
    await worker.recognize(canvas);

  const text =
    result.data.text
    .replace(/\s+/g,"");

  if(/朝食/.test(text))
    return "breakfast";

  if(/素泊|食事なし/.test(text))
    return "none";

  if(/プレミアム/.test(text))
    return "premium";

  if(/レギュラー/.test(text))
    return "regular";

  return "unknown";
}


/*
==================================================
備考OCR
==================================================
*/

async function readNote(
  worker,
  source,
  room
){

  const [y1,y2] =
    rowBounds(room);

  const canvas =
    cropNormalized(
      source,
      FORM.noteX1,
      y1,
      FORM.noteX2,
      y2,
      3
    );

  const result =
    await worker.recognize(canvas);

  let text =
    result.data.text
    .replace(/\n+/g," ")
    .replace(/\s+/g," ")
    .trim();

  /*
  ほぼ空なら備考なし
  */

  if(text.length < 3)
    return "";

  return text;
}


/*
==================================================
メイン読み取り
==================================================
*/

async function readAssignment(){

  if(!selectedFile){

    alert(
      "先に写真を選択してください"
    );

    return;
  }

  $("ocrArea")
    .classList
    .remove("hidden");

  $("progressBar").style.width =
    "0%";

  $("ocrStatus").textContent =
    "写真を自動補正しています…";

  const cvReady =
    await waitForCV();

  if(!cvReady){

    alert(
      "画像補正機能の読み込みに失敗しました。通信状態を確認してください。"
    );

    return;
  }

  try{

    const img =
      await loadImage(
        selectedFile
      );

    const corrected =
      autoCorrectDocument(img);

    $("correctedPreview").src =
      corrected.toDataURL(
        "image/jpeg",
        0.9
      );

    $("correctedCard")
      .classList
      .remove("hidden");

    $("ocrStatus").textContent =
      "OCRを準備しています…";

    /*
    数字専用worker
    */

    const digitWorker =
      await Tesseract.createWorker(
        "eng",
        1
      );

    await digitWorker.setParameters({
      tessedit_char_whitelist:
        "0123456789",
      tessedit_pageseg_mode:
        "7"
    });

    /*
    日本語worker
    */

    const jpWorker =
      await Tesseract.createWorker(
        "jpn+eng",
        1
      );

    const newRooms = [];

    for(
      let room=1;
      room<=32;
      room++
    ){

      $("progressBar").style.width =
        Math.round(
          ((room-1)/32)*100
        ) + "%";

      $("ocrStatus").textContent =
        room +
        "号室：男・女・子A〜Dを読み取り中…";

      /*
      大人・子供人数
      */

      const counts =
        await readCounts(
          digitWorker,
          corrected,
          room
        );

      /*
      食事
      */

      $("ocrStatus").textContent =
        room +
        "号室：食事を読み取り中…";

      const meal =
        await readMeal(
          jpWorker,
          corrected,
          room
        );

      /*
      備考
      */

      $("ocrStatus").textContent =
        room +
        "号室：備考を読み取り中…";

      const note =
        await readNote(
          jpWorker,
          corrected,
          room
        );

      const review =
        counts.review ||
        meal === "unknown";

      newRooms.push({

        room:String(room),

        male:
          counts.male,

        female:
          counts.female,

        childA:
          counts.childA,

        childB:
          counts.childB,

        childC:
          counts.childC,

        childD:
          counts.childD,

        adult:
          counts.adult,

        child:
          counts.child,

        meal,

        note,

        ice:null,

        review

      });
    }

    await digitWorker.terminate();
    await jpWorker.terminate();

    rooms =
      newRooms;

    save();

    $("progressBar").style.width =
      "100%";

    const reviewCount =
      rooms.filter(
        r=>r.review
      ).length;

    $("ocrStatus").textContent =
      "32室完了／要確認 " +
      reviewCount +
      "室";

    alert(
      "32室を読み取りました。\n\n"+
      "要確認："+
      reviewCount+
      "室\n\n"+
      "赤い「要確認」の部屋だけ確認してください。"
    );

  }catch(err){

    console.error(err);

    $("ocrStatus").textContent =
      "読み取りに失敗しました。";

    alert(
      "読み取りに失敗しました。写真を真正面から撮影して再度試してください。"
    );
  }
}

$("readBtn").onclick =
  readAssignment;


/*
==================================================
一覧
==================================================
*/

function renderList(){

  const box =
    $("roomList");

  if(!rooms.length){

    box.innerHTML =
      "まだ読み取っていません。";

    return;
  }

  rooms.sort(
    (a,b)=>
      Number(a.room)-
      Number(b.room)
  );

  box.innerHTML =
    rooms.map(r=>{

      const total =
        Number(r.adult||0)+
        Number(r.child||0);

      return `
      <div class="roomRow">

        <strong>
          ${r.room}号室
        </strong>

        <div>

          <span class="pill">
            大人${r.adult}名
          </span>

          <span class="pill">
            子供${r.child}名
          </span>

          <span class="pill">
            シーツ${sheetsFor(total)}
          </span>

          <span class="pill">
            BOX:${boxNeeded(r.meal)?1:0}
          </span>

          ${
            r.review
            ? '<span class="review">⚠ 要確認</span>'
            : ''
          }

          ${
            r.note
            ? '<div class="warn">⚠ '+escapeHtml(r.note)+'</div>'
            : ''
          }

        </div>

        <button
          class="secondary"
          onclick="showRoom('${r.room}')">
          表示
        </button>

      </div>
      `;
    }).join("");
}


/*
==================================================
統計
==================================================
*/

function updateStats(){

  $("roomCount").textContent =
    rooms.length;

  $("boxCount").textContent =
    rooms.filter(
      r=>boxNeeded(r.meal)
    ).length;

  $("iceCount").textContent =
    rooms.filter(
      r=>r.ice==="no"
    ).length;
}


/*
==================================================
画面
==================================================
*/

function showSection(id){

  [
    "home",
    "roomView",
    "editView"
  ].forEach(name=>{

    $(name).classList.toggle(
      "hidden",
      name!==id
    );

  });
}


/*
==================================================
部屋表示
==================================================
*/

window.showRoom =
function(room){

  current =
    rooms.find(
      r=>
        String(r.room)===
        String(room)
    );

  if(!current){

    alert(
      "部屋が見つかりません"
    );

    return;
  }

  const total =
    Number(current.adult||0)+
    Number(current.child||0);

  $("vRoom").textContent =
    current.room;

  $("vAdult").textContent =
    current.adult;

  $("vChild").textContent =
    current.child;

  $("vTotal").textContent =
    total;

  $("vSheets").textContent =
    sheetsFor(total);

  $("vBox").textContent =
    boxNeeded(current.meal)
    ? "1個 必要"
    : current.meal==="unknown"
    ? "要確認"
    : "不要";

  $("vMeal").textContent =
    "食事："+
    mealLabel(current.meal);

  $("vNote").textContent =
    current.note||
    "特記事項なし";

  $("iceState").textContent =
    current.ice==="yes"
    ? "確認済み：氷あり"
    : current.ice==="no"
    ? "要補充：氷なし"
    : "未確認";

  showSection(
    "roomView"
  );
};


/*
==================================================
検索
==================================================
*/

$("quickBtn").onclick =
()=>showRoom(
  $("quickRoom")
    .value
    .trim()
);

$("quickRoom")
.addEventListener(
  "keydown",
  e=>{
    if(e.key==="Enter"){
      $("quickBtn").click();
    }
  }
);


/*
==================================================
戻る
==================================================
*/

$("backBtn").onclick =
()=>showSection("home");


/*
==================================================
氷
==================================================
*/

$("iceYes").onclick =
()=>{

  if(!current)return;

  current.ice="yes";

  save();

  showRoom(
    current.room
  );
};

$("iceNo").onclick =
()=>{

  if(!current)return;

  current.ice="no";

  save();

  showRoom(
    current.room
  );
};


/*
==================================================
氷補充
==================================================
*/

$("iceListBtn").onclick =
()=>{

  const list =
    rooms.filter(
      r=>r.ice==="no"
    );

  if(!list.length){

    alert(
      "氷補充が必要な部屋はありません"
    );

    return;
  }

  alert(
    "氷補充："+
    list.length+
    "室\n\n"+
    list.map(
      r=>r.room+"号室"
    ).join("\n")
  );
};


/*
==================================================
手動修正
==================================================
*/

$("editBtn").onclick =
()=>{

  if(!current)return;

  $("eRoom").value =
    current.room;

  $("eAdult").value =
    current.adult;

  $("eChild").value =
    current.child;

  $("eMeal").value =
    current.meal;

  $("eNote").value =
    current.note||"";

  showSection(
    "editView"
  );
};

$("cancelEdit").onclick =
()=>showRoom(
  current.room
);

$("saveEdit").onclick =
()=>{

  current.adult =
    Number(
      $("eAdult").value
    )||0;

  current.child =
    Number(
      $("eChild").value
    )||0;

  current.meal =
    $("eMeal").value;

  current.note =
    $("eNote")
      .value
      .trim();

  current.review=false;

  save();

  showRoom(
    current.room
  );
};


/*
==================================================
初期表示
==================================================
*/

renderList();
updateStats();

</script>

</body>
</html>
