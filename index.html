*{box-sizing:border-box}

body{

  background:var(--bg);
  color:var(--text);
}

header{
  position:sticky;
  top:0;
  z-index:20;

  color:#fff;
  padding:15px 16px;
  font-size:19px;
  font-weight:900;
}

main{
  max-width:760px;
  margin:auto;
  padding:14px 14px 110px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:13px;
  box-shadow:0 1px 8px #0001;
}

button,.btn{

  border:0;
  border-radius:12px;

  color:#fff;
}

}

.ok{background:#126a2f!important}

  width:100%;

  border-radius:11px;
  background:#fff;
  font-size:18px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.hidden{display:none!important}
.muted{color:var(--muted)}
.warn{color:#b00020;font-weight:900}

  background:#f0f0f0;

  border-radius:13px;
}

}

.big{

}

.mid{

}

  border-radius:13px;

  font-weight:900;

}

footer{

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>

const $ = id => document.getElementById(id);

let rooms =
JSON.parse(
  localStorage.getItem("roomHelperV4") || "[]"
);

let selectedFile = null;
let current = null;


/* ==================================================
基本ルール
================================================== */

function sheetsFor(total){

  total = Number(total) || 0;

  if(total <= 0) return 0;

  return Math.min(total,4);
}


function boxNeeded(meal){

  return (
    meal === "regular" ||
    meal === "premium"
  );
}


function mealLabel(meal){

  switch(meal){

    case "regular":
      return "レギュラー";

    case "premium":
      return "プレミアム";

    case "breakfast":
      return "朝食のみ";

    case "none":
      return "素泊まり";

    default:
      return "食事不明";
  }
}


function escapeHtml(text){

  return String(text || "")
  .replace(/[&<>"]/g,m=>({

    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;"

  }[m]));
}


function save(){

  localStorage.setItem(
    "roomHelperV4",
    JSON.stringify(rooms)
  );

  renderList();
  updateStats();
}


/* ==================================================
写真選択
================================================== */

function selectPhoto(file){

  if(!file) return;

  selectedFile = file;

  $("selectedName").textContent =
    "選択中：" + file.name;

  $("preview").src =
    URL.createObjectURL(file);

  $("preview").classList.remove("hidden");
}


$("cameraPhoto").onchange =
e => selectPhoto(e.target.files[0]);


$("libraryPhoto").onchange =
e => selectPhoto(e.target.files[0]);


/* ==================================================
画像ロード
================================================== */

function loadImage(file){

  return new Promise((resolve,reject)=>{

    const img =
      new Image();

    img.onload =
      ()=>resolve(img);

    img.onerror =
      reject;

    img.src =
      URL.createObjectURL(file);

  });
}


/* ==================================================
用紙の自動トリミング

OpenCVは使わない。
白い用紙と暗い背景の差を利用する。
================================================== */

function autoCropPaper(img){

  const maxSide = 1400;

  const scale =
    Math.min(
      1,
      maxSide /
      Math.max(img.width,img.height)
    );

  const canvas =
    document.createElement("canvas");

  canvas.width =
    Math.round(img.width*scale);

  canvas.height =
    Math.round(img.height*scale);

  const ctx =
    canvas.getContext("2d",{
      willReadFrequently:true
    });

  ctx.drawImage(
    img,
    0,0,
    canvas.width,
    canvas.height
  );

  const imageData =
    ctx.getImageData(
      0,0,
      canvas.width,
      canvas.height
    );

  const d =
    imageData.data;

  let minX = canvas.width;
  let maxX = 0;

  let minY = canvas.height;
  let maxY = 0;

  /*
  用紙は背景より明るい前提。
  画面中央近辺から明るい領域を探す。
  */

  for(
    let y=0;
    y<canvas.height;
    y+=3
  ){

    for(
      let x=0;
      x<canvas.width;
      x+=3
    ){

      const i =
        (y*canvas.width+x)*4;

      const gray =
        (
          d[i] +
          d[i+1] +
          d[i+2]
        ) / 3;

      if(gray > 125){

        minX =
          Math.min(minX,x);

        maxX =
          Math.max(maxX,x);

        minY =
          Math.min(minY,y);

        maxY =
          Math.max(maxY,y);
      }
    }
  }


  /*
  検出不能なら元画像
  */

  if(
    maxX <= minX ||
    maxY <= minY
  ){

    return canvas;
  }


  const padX =
    Math.round(
      (maxX-minX)*0.015
    );

  const padY =
    Math.round(
      (maxY-minY)*0.015
    );


  minX =
    Math.max(
      0,
      minX-padX
    );

  maxX =
    Math.min(
      canvas.width,
      maxX+padX
    );

  minY =
    Math.max(
      0,
      minY-padY
    );

  maxY =
    Math.min(
      canvas.height,
      maxY+padY
    );


  const out =
    document.createElement("canvas");

  out.width =
    maxX-minX;

  out.height =
    maxY-minY;


  out.getContext("2d")
  .drawImage(

    canvas,

    minX,
    minY,
    out.width,
    out.height,

    0,
    0,
    out.width,
    out.height

  );

  return out;
}


/* ==================================================
暗さ
================================================== */

function darkness(
  data,
  width,
  x,
  y
){

  const i =
    (y*width+x)*4;

  const gray =
    (
      data[i] +
      data[i+1] +
      data[i+2]
    ) / 3;

  return 255-gray;
}


/* ==================================================
ピーク検出
================================================== */

function findPeaks(
  values,
  minimumDistance,
  thresholdRatio
){

  const max =
    Math.max(...values);

  const threshold =
    max * thresholdRatio;

  let candidates = [];

  for(
    let i=1;
    i<values.length-1;
    i++
  ){

    if(
      values[i] >= threshold &&
      values[i] >= values[i-1] &&
      values[i] >= values[i+1]
    ){

      candidates.push({
        pos:i,
        value:values[i]
      });
    }
  }


  candidates.sort(
    (a,b)=>b.value-a.value
  );


  let selected = [];

  for(const c of candidates){

    if(
      selected.every(
        s =>
        Math.abs(
          s.pos-c.pos
        ) >= minimumDistance
      )
    ){

      selected.push(c);
    }
  }


  selected.sort(
    (a,b)=>a.pos-b.pos
  );


  return selected.map(
    x=>x.pos
  );
}


/* ==================================================
罫線検出

表は14列なので縦線15本。
ヘッダー下＋32室なので横線33本程度。
================================================== */

function detectGrid(canvas){

  const ctx =
    canvas.getContext(
      "2d",
      {willReadFrequently:true}
    );

  const img =
    ctx.getImageData(
      0,0,
      canvas.width,
      canvas.height
    );

  const d =
    img.data;


  /*
  表は用紙の上部約10%〜90%
  */

  const xStart =
    Math.round(
      canvas.width*0.02
    );

  const xEnd =
    Math.round(
      canvas.width*0.97
    );

  const yStart =
    Math.round(
      canvas.height*0.08
    );

  const yEnd =
    Math.round(
      canvas.height*0.91
    );


  /*
  横線スコア
  */

  let horizontal =
    new Array(
      canvas.height
    ).fill(0);


  for(
    let y=yStart;
    y<yEnd;
    y++
  ){

    let sum = 0;

    for(
      let x=xStart;
      x<xEnd;
      x+=2
    ){

      sum +=
        darkness(
          d,
          canvas.width,
          x,
          y
        );
    }

    horizontal[y] =
      sum;
  }


  /*
  縦線スコア
  */

  let vertical =
    new Array(
      canvas.width
    ).fill(0);


  for(
    let x=xStart;
    x<xEnd;
    x++
  ){

    let sum = 0;

    for(
      let y=yStart;
      y<yEnd;
      y+=2
    ){

      sum +=
        darkness(
          d,
          canvas.width,
          x,
          y
        );
    }

    vertical[x] =
      sum;
  }


  let hPeaks =
    findPeaks(
      horizontal,
      Math.max(
        4,
        canvas.height/100
      ),
      0.38
    );


  let vPeaks =
    findPeaks(
      vertical,
      Math.max(
        4,
        canvas.width/80
      ),
      0.40
    );


  /*
  横線は表部分だけに絞る。
  最も33本に近い連続区間を使う。
  */

  if(hPeaks.length > 40){

    hPeaks =
      hPeaks.slice(
        0,
        40
      );
  }


  /*
  縦線は15本必要。
  強すぎる余分な線があるため
  表幅の大きなまとまりを使用。
  */

  return {
    hPeaks,
    vPeaks
  };
}


/* ==================================================
横線を32室用に補正

検出が多少足りなくても、
一番上・下から等間隔で補完する。
================================================== */

function normalizeRows(
  peaks,
  canvasHeight
){

  peaks =
    peaks.filter(
      y =>
      y >
      canvasHeight*0.08 &&
      y <
      canvasHeight*0.93
    );


  /*
  近すぎる線を統合
  */

  let merged = [];

  for(const p of peaks){

    const last =
      merged[
        merged.length-1
      ];

    if(
      last !== undefined &&
      Math.abs(
        p-last
      ) < 5
    ){

      merged[
        merged.length-1
      ] =
      Math.round(
        (last+p)/2
      );

    }else{

      merged.push(p);
    }
  }


  /*
  33本以上ある場合
  連続間隔が最も安定する33本を探す
  */

  if(merged.length >= 33){

    let best = null;
    let bestScore = Infinity;

    for(
      let start=0;
      start<=merged.length-33;
      start++
    ){

      const group =
        merged.slice(
          start,
          start+33
        );

      const gaps = [];

      for(
        let i=1;
        i<group.length;
        i++
      ){

        gaps.push(
          group[i]-group[i-1]
        );
      }

      const avg =
        gaps.reduce(
          (a,b)=>a+b,
          0
        ) /
        gaps.length;

      const variance =
        gaps.reduce(
          (a,b)=>
          a +
          Math.pow(
            b-avg,
            2
          ),
          0
        );

      if(
        variance <
        bestScore
      ){

        bestScore =
          variance;

        best =
          group;
      }
    }

    if(best)
      return best;
  }


  /*
  フォールバック。
  今回の帳票位置を利用。
  */

  const top =
    canvasHeight*0.105;

  const bottom =
    canvasHeight*0.895;

  const rows = [];

  for(
    let i=0;
    i<=32;
    i++
  ){

    rows.push(
      Math.round(
        top +
        (
          bottom-top
        ) *
        i/32
      )
    );
  }

  return rows;
}


/* ==================================================
縦線補正

15本見つからない場合は
サンプル比率を使用。
================================================== */

function normalizeColumns(
  peaks,
  width
){

  peaks =
    peaks.filter(
      x =>
      x >
      width*0.02 &&
      x <
      width*0.98
    );


  if(peaks.length >= 15){

    /*
    端から15本選ぶのではなく
    表幅が最大になる15本を利用
    */

    let best = null;
    let bestWidth = 0;

    for(
      let i=0;
      i<=peaks.length-15;
      i++
    ){

      const group =
        peaks.slice(
          i,
          i+15
        );

      const w =
        group[14]-
        group[0];

      if(w > bestWidth){

        bestWidth = w;
        best = group;
      }
    }

    if(best)
      return best;
  }


  /*
  今回の帳票の列比率
  */

  const ratios = [
    0.024,
    0.104,
    0.151,
    0.195,
    0.319,
    0.359,
    0.417,
    0.461,
    0.505,
    0.548,
    0.590,
    0.633,
    0.676,
    0.930,
    0.975
  ];

  return ratios.map(
    r =>
    Math.round(
      width*r
    )
  );
}


/* ==================================================
セル切り出し
================================================== */

function cropCell(
  source,
  x1,
  y1,
  x2,
  y2,
  scale=4
){

  /*
  罫線を避ける
  */

  const marginX =
    Math.max(
      1,
      (x2-x1)*0.10
    );

  const marginY =
    Math.max(
      1,
      (y2-y1)*0.10
    );


  x1 += marginX;
  x2 -= marginX;

  y1 += marginY;
  y2 -= marginY;


  const w =
    Math.max(
      1,
      x2-x1
    );

  const h =
    Math.max(
      1,
      y2-y1
    );


  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    Math.round(
      w*scale
    );

  canvas.height =
    Math.round(
      h*scale
    );


  const ctx =
    canvas.getContext(
      "2d",
      {willReadFrequently:true}
    );


  ctx.drawImage(
    source,

    x1,
    y1,
    w,
    h,

    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
  OCR向け処理
  */

  const img =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  const d =
    img.data;


  for(
    let i=0;
    i<d.length;
    i+=4
  ){

    const gray =
      0.299*d[i] +
      0.587*d[i+1] +
      0.114*d[i+2];


    /*
    白背景・黒文字へ
    */

    const v =
      gray > 175
      ? 255
      :
      gray < 110
      ? 0
      :
      gray;


    d[i] =
      d[i+1] =
      d[i+2] =
      v;
  }


  ctx.putImageData(
    img,
    0,
    0
  );


  return canvas;
}


/* ==================================================
数字セル
================================================== */

async function readDigit(
  worker,
  canvas
){

  const result =
    await worker.recognize(
      canvas
    );

  const text =
    result.data.text
    .replace(
      /[^0-9]/g,
      ""
    );


  if(!text)
    return null;


  const n =
    Number(
      text.charAt(0)
    );


  if(
    !Number.isInteger(n) ||
    n<0 ||
    n>9
  ){

    return null;
  }


  return n;
}


/* ==================================================
食事
================================================== */

async function readMeal(
  worker,
  canvas
){

  const result =
    await worker.recognize(
      canvas
    );


  const text =
    result.data.text
    .replace(
      /\s+/g,
      ""
    );


  if(
    /朝食/.test(text)
  ){

    return "breakfast";
  }


  if(
    /素泊|食事なし/.test(text)
  ){

    return "none";
  }


  if(
    /プレミアム/.test(text)
  ){

    return "premium";
  }


  if(
    /レギュラー/.test(text)
  ){

    return "regular";
  }


  return "unknown";
}


/* ==================================================
備考
================================================== */

async function readNote(
  worker,
  canvas
){

  const result =
    await worker.recognize(
      canvas
    );


  let text =
    result.data.text
    .replace(
      /\n+/g,
      " "
    )
    .replace(
      /\s+/g,
      " "
    )
    .trim();


  if(
    text.length < 3
  ){

    return "";
  }


  return text;
}


/* ==================================================
メインOCR
================================================== */

async function readAssignment(){

  if(!selectedFile){

    alert(
      "先に写真を選択してください"
    );

    return;
  }


  $("ocrArea")
  .classList
  .remove(
    "hidden"
  );


  $("progressBar")
  .style.width =
    "0%";


  $("ocrStatus")
  .textContent =
    "写真を補正しています…";


  let digitWorker;
  let jpWorker;


  try{

    const img =
      await loadImage(
        selectedFile
      );


    /*
    Canvasだけで用紙を補正
    */

    const corrected =
      autoCropPaper(
        img
      );


    $("correctedPreview")
    .src =
      corrected.toDataURL(
        "image/jpeg",
        0.92
      );


    $("correctedCard")
    .classList
    .remove(
      "hidden"
    );


    /*
    罫線自動検出
    */

    $("ocrStatus")
    .textContent =
      "表の罫線を検出しています…";


    const grid =
      detectGrid(
        corrected
      );


    const rows =
      normalizeRows(
        grid.hPeaks,
        corrected.height
      );


    const cols =
      normalizeColumns(
        grid.vPeaks,
        corrected.width
      );


    /*
    列番号

    0 番号
    1 前日
    2 当日
    3 名前
    4 泊数
    5 食事
    6 男
    7 女
    8 子A
    9 子B
    10 子C
    11 子D
    12 備考
    13 リピ
    */


    digitWorker =
      await Tesseract
      .createWorker(
        "eng",
        1
      );


    await digitWorker
    .setParameters({

      tessedit_char_whitelist:
        "0123456789",

      tessedit_pageseg_mode:
        "10"

    });


    jpWorker =
      await Tesseract
      .createWorker(
        "jpn+eng",
        1
      );


    const newRooms = [];


    for(
      let room=1;
      room<=32;
      room++
    ){

      const pct =
        Math.round(
          (
            room-1
          ) /
          32 *
          100
        );


      $("progressBar")
      .style.width =
        pct + "%";


      $("ocrStatus")
      .textContent =
        room +
        "号室を読み取り中…";


      const y1 =
        rows[
          room-1
        ];


      const y2 =
        rows[
          room
        ];


      /*
      男
      */

      const male =
        await readDigit(

          digitWorker,

          cropCell(
            corrected,
            cols[6],
            y1,
            cols[7],
            y2,
            5
          )

        );


      /*
      女
      */

      const female =
        await readDigit(

          digitWorker,

          cropCell(
            corrected,
            cols[7],
            y1,
            cols[8],
            y2,
            5
          )

        );


      /*
      子A
      */

      const childA =
        await readDigit(

          digitWorker,

          cropCell(
            corrected,
            cols[8],
            y1,
            cols[9],
            y2,
            5
          )

        );


      /*
      子B
      */

      const childB =
        await readDigit(

          digitWorker,

          cropCell(
            corrected,
            cols[9],
            y1,
            cols[10],
            y2,
            5
          )

        );


      /*
      子C
      */

      const childC =
        await readDigit(

          digitWorker,

          cropCell(
            corrected,
            cols[10],
            y1,
            cols[11],
            y2,
            5
          )

        );


      /*
      子D
      */

      const childD =
        await readDigit(

          digitWorker,

          cropCell(
            corrected,
            cols[11],
            y1,
            cols[12],
            y2,
            5
          )

        );


      /*
      nullは0として計算するが
      要確認扱いにする
      */

      const values = [
        male,
        female,
        childA,
        childB,
        childC,
        childD
      ];


      const reviewCounts =
        values.some(
          v =>
          v === null
        );


      const safe =
        values.map(
          v =>
          v === null
          ? 0
          : v
        );


      const adult =
        safe[0] +
        safe[1];


      const child =
        safe[2] +
        safe[3] +
        safe[4] +
        safe[5];


      /*
      食事
      */

      const meal =
        await readMeal(

          jpWorker,

          cropCell(
            corrected,
            cols[5],
            y1,
            cols[6],
            y2,
            3
          )

        );


      /*
      備考
      */

      const note =
        await readNote(

          jpWorker,

          cropCell(
            corrected,
            cols[12],
            y1,
            cols[13],
            y2,
            2
          )

        );


      const review =
        reviewCounts ||
        meal ===
        "unknown";


      newRooms.push({

        room:
          String(room),

        male:
          safe[0],

        female:
          safe[1],

        childA:
          safe[2],

        childB:
          safe[3],

        childC:
          safe[4],

        childD:
          safe[5],

        adult,

        child,

        meal,

        note,

        ice:null,

        review

      });

    }


    await digitWorker
    .terminate();


    await jpWorker
    .terminate();


    rooms =
      newRooms;


    save();


    $("progressBar")
    .style.width =
      "100%";


    const reviews =
      rooms.filter(
        r =>
        r.review
      ).length;


    $("ocrStatus")
    .textContent =
      "32室読み取り完了／要確認 "
      +
      reviews
      +
      "室";


    alert(

      "読み取り完了\n\n"
      +
      "32室\n"
      +
      "要確認："
      +
      reviews
      +
      "室"

    );


  }catch(err){

    console.error(err);


    if(
      digitWorker
    ){

      try{
        await digitWorker
        .terminate();
      }catch(e){}
    }


    if(
      jpWorker
    ){

      try{
        await jpWorker
        .terminate();
      }catch(e){}
    }


    $("ocrStatus")
    .textContent =
      "読み取りに失敗しました";


    alert(

      "読み取りに失敗しました。\n"
      +
      "写真に用紙全体が入っているか確認してください。"

    );
  }
}


$("readBtn")
.onclick =
readAssignment;


/* ==================================================
一覧
================================================== */

function renderList(){

  const box =
    $("roomList");


  if(
    !rooms.length
  ){

    box.innerHTML =
      "まだ読み取っていません。";

    return;
  }


  rooms.sort(
    (a,b)=>
    Number(a.room) -
    Number(b.room)
  );


  box.innerHTML =
    rooms.map(r=>{


      const total =
        Number(
          r.adult || 0
        )
        +
        Number(
          r.child || 0
        );


      return `

      <div class="roomRow">

        <strong>
        ${r.room}号室
        </strong>

        <div>

          <span class="pill">
          大人${r.adult}名
          </span>

          <span class="pill">
          子供${r.child}名
          </span>

          <span class="pill">
          シーツ${sheetsFor(total)}
          </span>

          <span class="pill">
          BOX:${boxNeeded(r.meal)?1:0}
          </span>

          ${
            r.review
            ?
            '<span class="review">⚠ 要確認</span>'
            :
            ''
          }

          ${
            r.note
            ?
            '<div class="warn">⚠ '
            +
            escapeHtml(r.note)
            +
            '</div>'
            :
            ''
          }

        </div>

        <button
        class="secondary"
        onclick="showRoom('${r.room}')">
        表示
        </button>

      </div>

      `;

    }).join("");
}


/* ==================================================
集計
================================================== */

function updateStats(){

  $("roomCount")
  .textContent =
    rooms.length;


  $("boxCount")
  .textContent =
    rooms.filter(
      r =>
      boxNeeded(
        r.meal
      )
    ).length;


  $("iceCount")
  .textContent =
    rooms.filter(
      r =>
      r.ice === "no"
    ).length;
}


/* ==================================================
画面切替
================================================== */

function showSection(id){

  [
    "home",
    "roomView",
    "editView"
  ]
  .forEach(
    name => {

      $(name)
      .classList
      .toggle(
        "hidden",
        name !== id
      );

    }
  );
}


/* ==================================================
部屋表示
================================================== */

window.showRoom =
function(room){

  current =
    rooms.find(
      r =>
      String(r.room)
      ===
      String(room)
    );


  if(!current){

    alert(
      "部屋が見つかりません"
    );

    return;
  }


  const total =
    Number(
      current.adult || 0
    )
    +
    Number(
      current.child || 0
    );


  $("vRoom")
  .textContent =
    current.room;


  $("vAdult")
  .textContent =
    current.adult;


  $("vChild")
  .textContent =
    current.child;


  $("vTotal")
  .textContent =
    total;


  $("vSheets")
  .textContent =
    sheetsFor(
      total
    );


  $("vBox")
  .textContent =
    boxNeeded(
      current.meal
    )
    ?
    "1個 必要"
    :
    current.meal ===
    "unknown"
    ?
    "要確認"
    :
    "不要";


  $("vMeal")
  .textContent =
    "食事："
    +
    mealLabel(
      current.meal
    );


  $("vNote")
  .textContent =
    current.note
    ||
    "特記事項なし";


  $("iceState")
  .textContent =
    current.ice ===
    "yes"
    ?
    "確認済み：氷あり"
    :
    current.ice ===
    "no"
    ?
    "要補充：氷なし"
    :
    "未確認";


  showSection(
    "roomView"
  );
};


/* ==================================================
部屋検索
================================================== */

$("quickBtn")
.onclick =
()=>{

  showRoom(
    $("quickRoom")
    .value
    .trim()
  );

};


$("quickRoom")
.addEventListener(
  "keydown",
  e => {

    if(
      e.key === "Enter"
    ){

      $("quickBtn")
      .click();
    }

  }
);


/* ==================================================
戻る
================================================== */

$("backBtn")
.onclick =
()=>showSection(
  "home"
);


/* ==================================================
氷
================================================== */

$("iceYes")
.onclick =
()=>{

  if(!current)
    return;

  current.ice =
    "yes";

  save();

  showRoom(
    current.room
  );
};


$("iceNo")
.onclick =
()=>{

  if(!current)
    return;

  current.ice =
    "no";

  save();

  showRoom(
    current.room
  );
};


/* ==================================================
氷補充リスト
================================================== */

$("iceListBtn")
.onclick =
()=>{

  const list =
    rooms.filter(
      r =>
      r.ice === "no"
    );


  if(
    !list.length
  ){

    alert(
      "氷補充が必要な部屋はありません"
    );

    return;
  }


  alert(

    "氷補充："
    +
    list.length
    +
    "室\n\n"
    +
    list.map(
      r =>
      r.room +
      "号室"
    ).join("\n")

  );
};


/* ==================================================
手動修正
================================================== */

$("editBtn")
.onclick =
()=>{

  if(!current)
    return;


  $("eRoom")
  .value =
    current.room;


  $("eAdult")
  .value =
    current.adult;


  $("eChild")
  .value =
    current.child;


  $("eMeal")
  .value =
    current.meal;


  $("eNote")
  .value =
    current.note || "";


  showSection(
    "editView"
  );
};


$("cancelEdit")
.onclick =
()=>showRoom(
  current.room
);


$("saveEdit")
.onclick =
()=>{

  current.adult =
    Number(
      $("eAdult")
      .value
    ) || 0;


  current.child =
    Number(
      $("eChild")
      .value
    ) || 0;


  current.meal =
    $("eMeal")
    .value;


  current.note =
    $("eNote")
    .value
    .trim();


  current.review =
    false;


  save();


  showRoom(
    current.room
  );
};


/* ==================================================
起動
================================================== */

renderList();
updateStats();

</script>
