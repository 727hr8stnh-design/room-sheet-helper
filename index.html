<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>客室仕込みヘルパー</title>

<style>
:root{
  --bg:#f4f4f4;
  --card:#fff;
  --text:#111;
  --muted:#666;
  --danger:#b00020;
  --ok:#126a2f;
  --warn:#b56a00;
  --border:#ddd;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,
  "Helvetica Neue","Yu Gothic",sans-serif;
  background:var(--bg);
  color:var(--text);
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:#111;
  color:#fff;
  padding:15px 16px;
  font-weight:900;
  font-size:19px;
}

main{
  max-width:760px;
  margin:auto;
  padding:14px 14px 110px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:13px;
  box-shadow:0 1px 8px #0001;
}

h1,h2,h3{margin:0 0 12px}
h1{font-size:30px}
h2{font-size:22px}

button,.btn{
  appearance:none;
  border:0;
  border-radius:12px;
  padding:14px 15px;
  font-size:17px;
  font-weight:900;
  background:#111;
  color:#fff;
}

.secondary{
  background:#e7e7e7!important;
  color:#111!important;
}

.ok{background:#126a2f!important}
.danger{background:#b00020!important}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:11px;
  background:#fff;
  font-size:18px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.hidden{display:none!important}
.muted{color:#666}
.warn{color:#b00020;font-weight:900}

.stat{
  background:#f0f0f0;
  text-align:center;
  border-radius:13px;
  padding:12px 5px;
}

.stat strong{
  display:block;
  font-size:30px;
}

.big{
  font-size:40px;
  font-weight:900;
}

.mid{
  font-size:27px;
  font-weight:900;
}

.note{
  border:3px solid #d00000;
  background:#fff1f1;
  border-radius:13px;
  padding:13px;
  font-size:19px;
  font-weight:900;
  white-space:pre-wrap;
}

.roomRow{
  display:grid;
  grid-template-columns:76px 1fr auto;
  align-items:center;
  gap:8px;
  padding:11px 0;
  border-bottom:1px solid #eee;
}

.pill{
  display:inline-block;
  background:#eee;
  border-radius:999px;
  padding:5px 8px;
  font-weight:800;
  font-size:13px;
  margin:2px;
}

.check{
  display:inline-block;
  color:#b00020;
  font-weight:900;
  font-size:13px;
}

.photoButton{
  display:block;
  text-align:center;
  cursor:pointer;
}

#preview{
  display:none;
  width:100%;
  max-height:320px;
  object-fit:contain;
  margin-top:12px;
  border-radius:10px;
  background:#ddd;
}

.progress{
  height:10px;
  border-radius:999px;
  background:#ddd;
  overflow:hidden;
  margin-top:12px;
}

.progress div{
  height:100%;
  width:0%;
  background:#111;
}

#debugCanvas{display:none}

footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  padding:
  10px
  calc(10px + env(safe-area-inset-right))
  calc(10px + env(safe-area-inset-bottom))
  calc(10px + env(safe-area-inset-left));
  border-top:1px solid #ddd;
  z-index:20;
}

footer button{
  width:100%;
  max-width:720px;
  display:block;
  margin:auto;
}
</style>
</head>

<body>

<header>客室仕込みヘルパー</header>

<main>

<section id="home">

<div class="card">

<h2>今日のアサイン表</h2>

<div class="grid2">

<label class="btn photoButton" for="cameraPhoto">
カメラで撮影
</label>

<label class="btn secondary photoButton" for="libraryPhoto">
写真ライブラリ
</label>

</div>

<input
 id="cameraPhoto"
 type="file"
 accept="image/*"
 capture="environment"
 class="hidden"
>

<input
 id="libraryPhoto"
 type="file"
 accept="image/*"
 class="hidden"
>

<img id="preview">

<div id="selectedName"
 class="muted"
 style="margin-top:8px">
写真未選択
</div>

<div style="height:10px"></div>

<button id="readBtn">
32室を読み取る
</button>

<div id="ocrArea" class="hidden">

<div class="progress">
<div id="progressBar"></div>
</div>

<div id="ocrStatus"
 class="muted"
 style="margin-top:8px">
</div>

</div>

<div style="margin-top:10px;font-size:13px;color:#666">
このアプリは現在のルームアサイン表のレイアウト専用です。
写真は用紙全体が入るように、なるべく真正面から撮影してください。
</div>

</div>


<div class="card">

<h2>部屋をすぐ確認</h2>

<div class="grid2">

<input
 id="quickRoom"
 inputmode="numeric"
 placeholder="例 7"
>

<button id="quickBtn">
表示
</button>

</div>

</div>


<div class="card">

<h2>本日の集計</h2>

<div class="grid3">

<div class="stat">
部屋
<strong id="roomCount">0</strong>
</div>

<div class="stat">
BOX
<strong id="boxCount">0</strong>
</div>

<div class="stat">
氷補充
<strong id="iceCount">0</strong>
</div>

</div>

</div>


<div class="card">

<h2>読み取り結果</h2>

<div id="roomList" class="muted">
まだ読み取っていません。
</div>

</div>

</section>


<section id="roomView" class="hidden">

<div class="card">

<button
 class="secondary"
 id="backBtn">
← 一覧
</button>

<div style="height:12px"></div>

<h1>
<span id="vRoom"></span>号室
</h1>

<div class="grid3">

<div class="stat">
大人
<strong id="vAdult">0</strong>
</div>

<div class="stat">
子供
<strong id="vChild">0</strong>
</div>

<div class="stat">
合計
<strong id="vTotal">0</strong>
</div>

</div>

</div>


<div class="card">

<div class="muted">
シーツ
</div>

<div class="big">
<span id="vSheets">0</span>セット
</div>

</div>


<div class="card">

<div class="muted">
バッシングBOX
</div>

<div id="vBox" class="mid">
不要
</div>

<div id="vMeal"
 class="muted"
 style="margin-top:6px">
</div>

</div>


<div class="card">

<h2>氷確認</h2>

<div class="grid2">

<button id="iceYes" class="ok">
氷あり
</button>

<button id="iceNo" class="danger">
氷なし
</button>

</div>

<div id="iceState"
 class="muted"
 style="margin-top:10px">
</div>

</div>


<div class="card">

<h2>⚠ 特記事項</h2>

<div id="vNote" class="note">
特記事項なし
</div>

</div>


<div class="card">

<button
 class="secondary"
 id="editBtn">
この部屋を修正
</button>

</div>

</section>


<section id="editView" class="hidden">

<div class="card">

<h2>
部屋データ修正
</h2>

<label>客室番号</label>
<input id="eRoom" readonly>

<div style="height:8px"></div>

<div class="grid2">

<div>
<label>大人</label>
<input
 id="eAdult"
 type="number"
 min="0">
</div>

<div>
<label>子供</label>
<input
 id="eChild"
 type="number"
 min="0">
</div>

</div>

<div style="height:8px"></div>

<label>食事</label>

<select id="eMeal">

<option value="regular">
レギュラー
</option>

<option value="premium">
プレミアム
</option>

<option value="breakfast">
朝食のみ
</option>

<option value="none">
素泊まり
</option>

<option value="unknown">
不明
</option>

</select>

<div style="height:8px"></div>

<label>備考・特記事項</label>

<textarea
 id="eNote"
 rows="5">
</textarea>

<div style="height:12px"></div>

<div class="grid2">

<button
 class="secondary"
 id="cancelEdit">
キャンセル
</button>

<button id="saveEdit">
保存
</button>

</div>

</div>

</section>

</main>


<footer>
<button
 id="iceListBtn"
 class="secondary">
氷補充リスト
</button>
</footer>

<canvas id="debugCanvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>

const $ = id =>
document.getElementById(id);

let rooms =
JSON.parse(
localStorage.getItem("roomHelperRooms") || "[]"
);

let selectedFile = null;
let current = null;


/* =====================
保存
===================== */

function save(){

localStorage.setItem(
"roomHelperRooms",
JSON.stringify(rooms)
);

renderList();
updateStats();

}


/* =====================
シーツ
===================== */

function sheetsFor(total){

if(total <= 0) return 0;
if(total >= 4) return 4;

return total;

}


/* =====================
BOX
===================== */

function boxNeeded(meal){

return (
meal === "regular" ||
meal === "premium"
);

}


/* =====================
食事表示
===================== */

function mealLabel(meal){

switch(meal){

case "regular":
return "レギュラー";

case "premium":
return "プレミアム";

case "breakfast":
return "朝食のみ";

case "none":
return "素泊まり";

default:
return "食事不明";

}

}


/* =====================
写真
===================== */

function selectPhoto(file){

if(!file) return;

selectedFile = file;

$("selectedName").textContent =
"選択中：" + file.name;

const url =
URL.createObjectURL(file);

$("preview").src = url;
$("preview").style.display = "block";

}

$("cameraPhoto").onchange =
e => selectPhoto(e.target.files[0]);

$("libraryPhoto").onchange =
e => selectPhoto(e.target.files[0]);


/* =====================
画像読み込み
===================== */

function loadImage(file){

return new Promise(
(resolve,reject)=>{

const img = new Image();

img.onload =
()=>resolve(img);

img.onerror =
reject;

img.src =
URL.createObjectURL(file);

}
);

}


/* =====================
行画像を切り出す

今回提示された帳票専用座標
===================== */

function cropRow(img,row){

/*
サンプル画像から求めた
正規化座標。

用紙全体が写真に入っていることを
前提とする。
*/

const dataTop = 0.100;
const dataBottom = 0.840;

const cropLeft = 0.305;
const cropRight = 0.795;

const rowHeight =
(dataBottom - dataTop) / 32;

const y1 =
dataTop +
(row - 1) * rowHeight;

const y2 =
y1 + rowHeight;

const sx =
Math.floor(
img.width * cropLeft
);

const sy =
Math.floor(
img.height * y1
);

const sw =
Math.floor(
img.width *
(cropRight - cropLeft)
);

const sh =
Math.floor(
img.height *
(y2 - y1)
);


const scale = 3;

const canvas =
document.createElement("canvas");

canvas.width =
sw * scale;

canvas.height =
sh * scale;

const ctx =
canvas.getContext("2d");

ctx.imageSmoothingEnabled = true;

ctx.drawImage(
img,
sx,sy,sw,sh,
0,0,
canvas.width,
canvas.height
);


/*
グレースケール＋コントラスト
*/

const imageData =
ctx.getImageData(
0,0,
canvas.width,
canvas.height
);

const d =
imageData.data;

for(let i=0;i<d.length;i+=4){

const gray =
0.299*d[i] +
0.587*d[i+1] +
0.114*d[i+2];

let v =
(gray - 128) * 1.6 + 128;

v =
Math.max(
0,
Math.min(255,v)
);

d[i] =
d[i+1] =
d[i+2] =
v;

}

ctx.putImageData(
imageData,
0,0
);

return canvas;

}


/* =====================
OCRテキスト解析
===================== */

function analyseRowText(text){

let clean =
text
.replace(/\n/g," ")
.replace(/\s+/g," ")
.trim();


/*
食事
*/

let meal = "unknown";

if(
/朝食のみ|朝食|朝のみ/.test(clean)
){

meal = "breakfast";

}else if(
/素泊|食事なし/.test(clean)
){

meal = "none";

}else if(
/プレミアム/.test(clean)
){

meal = "premium";

}else if(
/レギュラー/.test(clean)
){

meal = "regular";

}


/*
人数数字

男 女 子A 子B 子C 子D
の6数字を狙う。

備考に数字があっても
前方6数字を優先。
*/

const digitMatches =
clean.match(
/(?<!\d)[0-9](?!\d)/g
) || [];


let counts = [];

for(const d of digitMatches){

counts.push(
parseInt(d,10)
);

if(counts.length === 6)
break;

}


let validCounts =
counts.length === 6;


while(counts.length < 6){

counts.push(0);

}


const [
male,
female,
childA,
childB,
childC,
childD
] = counts;


const adult =
male + female;

const child =
childA +
childB +
childC +
childD;


/*
備考

特定キーワードが入っている場合
OCR全文を備考候補として保存
*/

const noteWords = [
"アレルギー",
"除去",
"変更",
"ダイニング",
"休止",
"乳製品",
"卵",
"えび",
"希望",
"記念",
"誕生日",
"ベッド",
"幼児"
];

let note = "";

if(
noteWords.some(
w => clean.includes(w)
)
){

note = clean;

}


/*
認識チェック
*/

let review = false;

if(!validCounts)
review = true;

if(meal === "unknown")
review = true;


return {

adult,
child,
meal,
note,
review,
raw:clean

};

}


/* =====================
OCR
===================== */

async function readAssignment(){

if(!selectedFile){

alert(
"先に写真を選択してください"
);

return;

}


$("ocrArea")
.classList.remove("hidden");

$("progressBar")
.style.width = "0%";

$("ocrStatus")
.textContent =
"OCRを準備しています…";


const img =
await loadImage(selectedFile);


let worker;

try{

worker =
await Tesseract.createWorker(
"jpn+eng",
1
);

await worker.setParameters({

tessedit_pageseg_mode:"6",

preserve_interword_spaces:"1"

});


const newRooms = [];


for(
let room=1;
room<=32;
room++
){

const pct =
Math.round(
((room-1)/32)*100
);

$("progressBar")
.style.width =
pct + "%";

$("ocrStatus")
.textContent =
room +
"号室を読み取り中…";


const canvas =
cropRow(
img,
room
);


const result =
await worker.recognize(
canvas
);


const parsed =
analyseRowText(
result.data.text
);


newRooms.push({

room:String(room),

adult:
parsed.adult,

child:
parsed.child,

meal:
parsed.meal,

note:
parsed.note,

ice:null,

review:
parsed.review,

raw:
parsed.raw

});

}


await worker.terminate();


rooms =
newRooms;


save();


$("progressBar")
.style.width =
"100%";


const reviewCount =
rooms.filter(
r=>r.review
).length;


$("ocrStatus")
.textContent =
"32室読み取り完了。要確認 "
+
reviewCount
+
"室";


alert(
"32室を読み取りました。\n\n"
+
"要確認："
+
reviewCount
+
"室\n\n"
+
"赤い「要確認」の部屋は、人数・食事・備考を確認してください。"
);


}catch(err){

console.error(err);

if(worker){

try{
await worker.terminate();
}catch(e){}

}

$("ocrStatus")
.textContent =
"OCRに失敗しました。";

alert(
"OCRに失敗しました。通信状態を確認してください。"
);

}

}

$("readBtn").onclick =
readAssignment;


/* =====================
一覧
===================== */

function renderList(){

const box =
$("roomList");

if(!rooms.length){

box.innerHTML =
"まだ読み取っていません。";

return;

}


rooms.sort(
(a,b)=>
Number(a.room) -
Number(b.room)
);


box.innerHTML =
rooms.map(r=>{

const total =
Number(r.adult || 0)
+
Number(r.child || 0);

return `

<div class="roomRow">

<strong>
${r.room}号室
</strong>

<div>

<span class="pill">
${total}名
</span>

<span class="pill">
シーツ${sheetsFor(total)}
</span>

<span class="pill">
BOX:${boxNeeded(r.meal) ? 1 : 0}
</span>

${
r.review
?
'<span class="check">⚠ 要確認</span>'
:
''
}

${
r.note
?
'<div class="warn">⚠ '+escapeHtml(r.note)+'</div>'
:
''
}

</div>

<button
 class="secondary"
 onclick="showRoom('${r.room}')">
表示
</button>

</div>

`;

}).join("");

}


/* =====================
HTML escape
===================== */

function escapeHtml(text){

return String(text || "")
.replace(
/[&<>"]/g,
m => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;"
}[m])
);

}


/* =====================
統計
===================== */

function updateStats(){

$("roomCount").textContent =
rooms.length;


$("boxCount").textContent =
rooms.filter(
r=>boxNeeded(r.meal)
).length;


$("iceCount").textContent =
rooms.filter(
r=>r.ice === "no"
).length;

}


/* =====================
画面
===================== */

function showSection(id){

["home","roomView","editView"]
.forEach(name=>{

$(name)
.classList
.toggle(
"hidden",
name !== id
);

});

}


/* =====================
客室
===================== */

window.showRoom =
function(room){

current =
rooms.find(
r=>String(r.room) === String(room)
);

if(!current){

alert(
"部屋が見つかりません"
);

return;

}


const total =
Number(current.adult || 0)
+
Number(current.child || 0);


$("vRoom").textContent =
current.room;

$("vAdult").textContent =
current.adult;

$("vChild").textContent =
current.child;

$("vTotal").textContent =
total;

$("vSheets").textContent =
sheetsFor(total);


$("vBox").textContent =
boxNeeded(current.meal)
?
"1個 必要"
:
current.meal === "unknown"
?
"要確認"
:
"不要";


$("vMeal").textContent =
"食事：" +
mealLabel(current.meal);


$("vNote").textContent =
current.note
?
current.note
:
"特記事項なし";


$("iceState").textContent =
current.ice === "yes"
?
"確認済み：氷あり"
:
current.ice === "no"
?
"要補充：氷なし"
:
"未確認";


showSection(
"roomView"
);

};


/* =====================
検索
===================== */

$("quickBtn").onclick =
()=>{

showRoom(
$("quickRoom")
.value
.trim()
);

};


$("quickRoom")
.addEventListener(
"keydown",
e=>{

if(e.key === "Enter")
$("quickBtn").click();

}
);


/* =====================
戻る
===================== */

$("backBtn").onclick =
()=>showSection("home");


/* =====================
氷
===================== */

$("iceYes").onclick =
()=>{

if(!current) return;

current.ice = "yes";

save();

showRoom(
current.room
);

};


$("iceNo").onclick =
()=>{

if(!current) return;

current.ice = "no";

save();

showRoom(
current.room
);

};


/* =====================
氷補充
===================== */

$("iceListBtn").onclick =
()=>{

const list =
rooms.filter(
r=>r.ice === "no"
);

if(!list.length){

alert(
"氷補充が必要な部屋はありません"
);

return;

}

alert(
"氷補充："
+
list.length
+
"室\n\n"
+
list
.map(
r=>r.room+"号室"
)
.join("\n")
);

};


/* =====================
修正
===================== */

$("editBtn").onclick =
()=>{

if(!current)
return;

$("eRoom").value =
current.room;

$("eAdult").value =
current.adult;

$("eChild").value =
current.child;

$("eMeal").value =
current.meal;

$("eNote").value =
current.note || "";

showSection(
"editView"
);

};


$("cancelEdit").onclick =
()=>{

showRoom(
current.room
);

};


$("saveEdit").onclick =
()=>{

current.adult =
Number(
$("eAdult").value
) || 0;

current.child =
Number(
$("eChild").value
) || 0;

current.meal =
$("eMeal").value;

current.note =
$("eNote")
.value
.trim();

current.review = false;

save();

showRoom(
current.room
);

};


/* =====================
初期
===================== */

renderList();

updateStats();

</script>

</body>
</html>
