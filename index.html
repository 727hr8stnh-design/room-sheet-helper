<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>客室仕込みヘルパー 8/26</title>

<style>
:root{
  --bg:#f4f4f4;
  --card:#fff;
  --text:#111;
  --muted:#666;
  --danger:#b00020;
  --ok:#126a2f;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  position:sticky;
  top:0;
  z-index:5;
  background:#111;
  color:#fff;
  padding:16px;
  font-size:20px;
  font-weight:900;
}
main{
  max-width:760px;
  margin:auto;
  padding:14px 14px 120px;
}
.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 1px 8px #0001;
}
h1,h2{margin:0 0 14px}
h1{font-size:34px}
h2{font-size:22px}

button{
  appearance:none;
  border:0;
  border-radius:13px;
  padding:15px 16px;
  font-size:17px;
  font-weight:900;
  background:#111;
  color:#fff;
}
button.secondary{
  background:#e7e7e7;
  color:#111;
}
button.ok{background:var(--ok)}
button.danger{background:var(--danger)}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.stat{
  background:#f0f0f0;
  border-radius:14px;
  padding:13px 5px;
  text-align:center;
  font-size:17px;
}
.stat strong{
  display:block;
  font-size:32px;
}
.big{
  font-size:42px;
  font-weight:900;
}
.mid{
  font-size:28px;
  font-weight:900;
}
.muted{color:#666}
.warn{color:#b00020;font-weight:900}
.hidden{display:none!important}

.roomRow{
  display:grid;
  grid-template-columns:75px 1fr 85px;
  gap:8px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #eee;
}
.roomRow strong{
  font-size:18px;
}
.pill{
  display:inline-block;
  background:#eee;
  border-radius:999px;
  padding:5px 9px;
  margin:2px;
  font-size:13px;
  font-weight:800;
}
.note{
  border:3px solid #d00000;
  background:#fff1f1;
  border-radius:12px;
  padding:12px;
  font-size:18px;
  font-weight:800;
  white-space:pre-wrap;
}
input{
  width:100%;
  padding:14px;
  font-size:19px;
  border:1px solid #ddd;
  border-radius:12px;
}
footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid #ddd;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  z-index:10;
}
footer button{
  width:100%;
}
</style>
</head>

<body>

<header>客室仕込みヘルパー｜8/26</header>

<main>

<section id="home">

  <div class="card">
    <h2>部屋をすぐ確認</h2>
    <div class="grid2">
      <input id="quickRoom" inputmode="numeric" placeholder="部屋番号">
      <button id="quickBtn">表示</button>
    </div>
  </div>

  <div class="card">
    <h2>本日の集計</h2>
    <div class="grid3">
      <div class="stat">使用室<strong id="roomCount">0</strong></div>
      <div class="stat">宿泊者<strong id="guestCount">0</strong></div>
      <div class="stat">氷補充<strong id="iceCount">0</strong></div>
    </div>
  </div>

  <div class="card">
    <h2>読み取り結果</h2>
    <div id="roomList"></div>
  </div>

</section>


<section id="roomView" class="hidden">

  <div class="card">
    <button class="secondary" id="backBtn">← 一覧</button>

    <div style="height:18px"></div>

    <h1><span id="vRoom"></span>号室</h1>

    <div class="grid3">
      <div class="stat">
        大人
        <strong id="vAdult">0</strong>
      </div>

      <div class="stat">
        子供
        <strong id="vChild">0</strong>
      </div>

      <div class="stat">
        合計
        <strong id="vTotal">0</strong>
      </div>
    </div>
  </div>


  <div class="card">
    <div class="muted">シーツ</div>
    <div class="big"><span id="vSheets">0</span>セット</div>
  </div>


  <div class="card">
    <div class="muted">バッシングBOX</div>
    <div id="vBox" class="mid">確認</div>
    <div id="vMeal" class="muted" style="margin-top:8px"></div>
  </div>


  <div class="card">
    <h2>氷確認</h2>

    <div class="grid2">
      <button class="ok" id="iceYes">氷あり</button>
      <button class="danger" id="iceNo">氷なし</button>
    </div>

    <div id="iceState" class="muted" style="margin-top:12px">
      未確認
    </div>
  </div>


  <div class="card">
    <h2>特記事項</h2>
    <div id="vNote" class="note">特記事項なし</div>
  </div>

</section>

</main>


<footer>
  <button class="secondary" id="iceListBtn">氷補充リスト</button>
</footer>


<script>

/*
=================================================
2026/8/26 緊急運用データ
adult = 男 + 女
child = 子A + 子B + 子C + 子D
=================================================
*/

const TODAY_DATA = [

{room:1, adult:3, child:0, meal:"dinner", note:"カラオケ18時半〜"},
{room:2, adult:2, child:1, meal:"dinner", note:""},
{room:3, adult:1, child:1, meal:"breakfast", note:""},

// 4号室 空室

{room:5, adult:3, child:1, meal:"dinner", note:""},

{room:6, adult:2, child:2, meal:"none",
 note:"前日もGRAX有り／夕食・朝食はホテルで利用（料金同額）"},

{room:7, adult:2, child:1, meal:"dinner", note:""},

{room:8, adult:2, child:2, meal:"breakfast", note:""},

{room:9, adult:2, child:4, meal:"premium", note:""},

{room:10, adult:2, child:2, meal:"dinner", note:""},

{room:11, adult:3, child:1, meal:"dinner", note:""},

{room:12, adult:2, child:1, meal:"none", note:"前ホテル"},

{room:13, adult:2, child:0, meal:"none", note:""},

{room:14, adult:1, child:0, meal:"none",
 note:"REDに空きがないのでGRAXで押さえています"},

{room:15, adult:2, child:2, meal:"dinner", note:""},

{room:16, adult:2, child:1, meal:"dinner",
 note:"オオサカ チョウタ様同グループ"},

{room:17, adult:4, child:0, meal:"dinner",
 note:"支払い方法：現払い"},

{room:18, adult:2, child:2, meal:"dinner", note:""},

{room:19, adult:3, child:1, meal:"dinner",
 note:"カラオケ 8/26 20:00〜21:00 1H"},

{room:20, adult:3, child:1, meal:"dinner", note:""},

{room:21, adult:2, child:2, meal:"breakfast", note:""},

{room:22, adult:2, child:3, meal:"dinner",
 note:"GRAX 2/2・繋ぎなし・人数どっちでもOK"},

{room:23, adult:2, child:2, meal:"premium", note:"翌日ホテル"},

{room:24, adult:2, child:1, meal:"none",
 note:"朝食ホテルで利用"},

{room:25, adult:2, child:3, meal:"none", note:""},

{room:26, adult:2, child:2, meal:"dinner", note:""},

{room:27, adult:2, child:2, meal:"dinner", note:""},

{room:28, adult:2, child:1, meal:"dinner", note:""},

{room:29, adult:3, child:1, meal:"dinner", note:""},

{room:30, adult:3, child:2, meal:"dinner",
 note:"2グループ、ホンダカズヤ"},

{room:31, adult:3, child:1, meal:"dinner", note:""},

{room:32, adult:2, child:2, meal:"premium",
 note:"肉鍋希望"}

];


/*
氷チェックだけ端末に保存
*/

const ICE_KEY = "ice_20260826";

let iceData =
JSON.parse(
  localStorage.getItem(ICE_KEY) || "{}"
);

let current = null;


function $(id){
  return document.getElementById(id);
}


function total(r){
  return r.adult + r.child;
}


/*
シーツは最大4セット
*/

function sheets(r){
  return Math.min(total(r),4);
}


function mealName(meal){

  switch(meal){

    case "dinner":
      return "レギュラー";

    case "breakfast":
      return "朝食のみ";

    case "none":
      return "素泊まり";

    case "premium":
      return "プレミアム";

    default:
      return "要確認";
  }
}


/*
夕食付き → バッシングBOX必要
朝食のみ・素泊まり → 不要
*/

function needsBox(r){

  return (
    r.meal === "dinner" ||
    r.meal === "premium"
  );
}


function renderList(){

  const box = $("roomList");

  box.innerHTML =
    TODAY_DATA.map(r=>{

      const ice =
        iceData[r.room];

      const iceMark =
        ice === "no"
        ? '<span class="warn">氷補充</span>'
        : "";

      return `

      <div class="roomRow">

        <strong>${r.room}号室</strong>

        <div>

          <span class="pill">
            ${total(r)}名
          </span>

          <span class="pill">
            大${r.adult}
          </span>

          <span class="pill">
            子${r.child}
          </span>

          <span class="pill">
            シーツ${sheets(r)}
          </span>

          <span class="pill">
            BOX:${needsBox(r) ? "1" : "0"}
          </span>

          ${iceMark}

        </div>

        <button
          class="secondary"
          onclick="showRoom(${r.room})">
          表示
        </button>

      </div>

      `;

    }).join("");

}


function updateStats(){

  $("roomCount").textContent =
    TODAY_DATA.length;

  $("guestCount").textContent =
    TODAY_DATA.reduce(
      (sum,r)=>sum+total(r),
      0
    );

  $("iceCount").textContent =
    TODAY_DATA.filter(
      r=>iceData[r.room]==="no"
    ).length;
}


function showRoom(room){

  const r =
    TODAY_DATA.find(
      x=>x.room===Number(room)
    );

  if(!r){

    alert(
      room + "号室は本日の使用部屋ではありません"
    );

    return;
  }

  current = r;

  $("vRoom").textContent =
    r.room;

  $("vAdult").textContent =
    r.adult;

  $("vChild").textContent =
    r.child;

  $("vTotal").textContent =
    total(r);

  $("vSheets").textContent =
    sheets(r);

  $("vMeal").textContent =
    "食事：" + mealName(r.meal);


  if(needsBox(r)){

    $("vBox").textContent =
      "1個 必要";

    $("vBox").className =
      "mid warn";

  }else{

    $("vBox").textContent =
      "不要";

    $("vBox").className =
      "mid";

  }


  $("vNote").textContent =
    r.note ||
    "特記事項なし";


  updateIceState();

  $("home").classList.add(
    "hidden"
  );

  $("roomView").classList.remove(
    "hidden"
  );

  window.scrollTo(
    0,
    0
  );

}


function updateIceState(){

  if(!current){
    return;
  }

  const state =
    iceData[current.room];

  if(state==="yes"){

    $("iceState").textContent =
      "確認済み：氷あり";

  }else if(state==="no"){

    $("iceState").textContent =
      "要補充：氷なし";

  }else{

    $("iceState").textContent =
      "未確認";

  }

}


function saveIce(){

  localStorage.setItem(
    ICE_KEY,
    JSON.stringify(iceData)
  );

  updateStats();
  renderList();
  updateIceState();
}


$("backBtn").onclick =
function(){

  $("roomView").classList.add(
    "hidden"
  );

  $("home").classList.remove(
    "hidden"
  );

};


$("quickBtn").onclick =
function(){

  const room =
    $("quickRoom").value.trim();

  if(!room){
    return;
  }

  showRoom(room);

};


$("quickRoom").addEventListener(
  "keydown",
  function(e){

    if(e.key==="Enter"){
      $("quickBtn").click();
    }

  }
);


$("iceYes").onclick =
function(){

  if(!current){
    return;
  }

  iceData[current.room] =
    "yes";

  saveIce();

};


$("iceNo").onclick =
function(){

  if(!current){
    return;
  }

  iceData[current.room] =
    "no";

  saveIce();

};


$("iceListBtn").onclick =
function(){

  const list =
    TODAY_DATA.filter(
      r=>iceData[r.room]==="no"
    );

  if(!list.length){

    alert(
      "氷補充が必要な部屋はありません"
    );

    return;
  }

  alert(
    "氷補充：" +
    list.length +
    "室\n\n" +
    list
      .map(r=>r.room+"号室")
      .join("\n")
  );

};


window.showRoom =
showRoom;


renderList();
updateStats();

</script>

</body>
</html>
